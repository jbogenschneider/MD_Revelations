 rev_rom_moldova_union.2.t:0 "Moldova Unites with Romania"
 rev_rom_moldova_union.2.d:0 "Moldova and Romania share the same language and increasingly the same culture. Moldova wants to join the EU and Nato so joining with Romania is the shortest road to prosperity."
 rev_rom_moldova_union.2.a:0 "Together into a new future."
