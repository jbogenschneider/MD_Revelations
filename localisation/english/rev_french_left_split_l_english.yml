 rev_fra_split.1.t: "The French Left Breaks Away"
 rev_fra_split.1.d: "Jean-Luc Mélenchon has proclaimed the French Popular Republic from Paris. La France Insoumise, EELV, and the Parti Socialiste form its governing coalition.\n\nThe new government claims Île-de-France, Haute-de-France, Normandie, Champagne-Ardennes, and Loire. Army formations historically based in those states have joined it. The rest of France remains under the existing French government, and the two administrations now face one another in civil war."
 rev_fra_split.1.a: "France is divided."
 rev_fra_split.2.t: "Le Pen's Loyalists Flee to the Borders"
 rev_fra_split.2.d: "Following the ousting of the National Front by a predominantly Christian movement, Marine Le Pen and those loyal to Alex have fled toward the Italian and Swiss borders, seizing what French territory they can along the way.\n\nSavoy, Provence, and Nice pass to Italy, which also annexes Monaco. Franche-Comté passes to Switzerland as the loyalists abandon the struggle for power in the rest of France."
 rev_fra_split.2.a: "The loyalists have taken the borderlands."
