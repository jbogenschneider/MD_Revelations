 rev_fra_split.1.t: "The French Left Breaks Away"
 rev_fra_split.1.d: "Jean-Luc Mélenchon has proclaimed the French Popular Republic from Paris. La France Insoumise, EELV, and the Parti Socialiste form its governing coalition.\n\nThe new government controls Île-de-France, Haute-de-France, Normandie, Loire, Pays de la Loire, Bretagne, and Languedoc-Roussillon. Several French Army formations have joined it. The rest of France remains under the existing French government, and the two administrations now face one another in civil war."
 rev_fra_split.1.a: "France is divided."
 rev_fra_split.2.t: "Le Pen's Administration Flees France"
 rev_fra_split.2.d: "After a predominantly Christian movement ousted the National Front, Marine Le Pen and her administration fled the country."
 rev_fra_split.2.a: "The old administration has fled."
