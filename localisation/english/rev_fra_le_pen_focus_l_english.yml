l_english:
 REV_FRA_le_pen_crack_down_on_anarchy: "Crack Down on Anarchy and Far-Left Protests"
 REV_FRA_le_pen_crack_down_on_anarchy_desc: "President Marine Le Pen orders a crackdown on anarchist unrest and far-left protests. Her government presents the operation as a restoration of public order and national resolve."
 REV_FRA_le_pen_reduce_work_visas: "Reduce Work Visas and Deport Non-EU Citizens"
 REV_FRA_le_pen_reduce_work_visas_desc: "Following the crackdown, the government will reduce work visas and carry out deportations of non-EU citizens. The administration expects the policy to strengthen domestic stability, at a cost of 10 to the treasury."
 REV_FRA_le_pen_force_nato_return: "Force Le Pen to Rejoin NATO"
 REV_FRA_le_pen_force_nato_return_desc: "France's withdrawal has left its former allies fighting the United States without French support. Pressure on President Marine Le Pen will force a reversal: France will rejoin NATO and enter the alliance's war against the USA. France must be outside any faction, and NATO must still be at war with the United States."
