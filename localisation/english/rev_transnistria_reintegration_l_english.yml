l_english:
 rev_transnistria.1.t:0 "Transnistria Returns to Moldova"
 rev_transnistria.1.d:0 "Russia gambled and allowed Transnistria to officially join the Russian Federation. Border raids disrupted Ukrainian territory for a few days, prompting Ukraine to occupy the region, disarm it and hand it back to Moldova.\n\nFormer citizens of Transnistria are welcome to leave and will be transported to Belarus if they choose to do so."
 rev_transnistria.1.a:0 "A new settlement in Eastern Europe."
