 rev_ita_election.1.t: "Roberto Vannacci Wins Italy's Election"
 rev_ita_election.1.d: "November 22, 2027. Italy has voted, and Roberto Vannacci has won the election.\n\nVannacci takes office as president, succeeding the government of Giorgia Meloni. His conservative government will govern within Italy's democratic system."
 rev_ita_election.1.a: "A new government takes office."
