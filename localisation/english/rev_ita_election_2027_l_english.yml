 rev_ita_election.1.t: "Roberto Vannacci Wins Italy's Election"
 rev_ita_election.1.d: "November 22, 2027. Italy has voted, and Roberto Vannacci has won the election at the head of Italy's Fascist party.\n\nVannacci takes office as president, succeeding the government of Giorgia Meloni with a pledge to lead Italy in a new direction."
 rev_ita_election.1.a: "A new government takes office."
