 rev_ita_election.1.t: "Stefano De Beaman Wins Italy's Election"
 rev_ita_election.1.d: "December 22, 2027. Italy has voted, and Stefano De Beaman has won the election at the head of Italy's Fascist party.\n\nDe Beaman replaces Giorgia Meloni as prime minister and takes office with a pledge to lead Italy in a new direction."
 rev_ita_election.1.a: "A new government takes office."
