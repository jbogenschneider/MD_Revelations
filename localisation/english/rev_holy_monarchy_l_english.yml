l_english:
 rev_holy_monarchy: "Holy Monarchy"
 rev_holy_monarchy_desc: "Consecrated to the service of God, our nation stands within the Holy Monarchy. Our stability and resolve are unshakeable: no matter how bad it gets, we know Thy Kingdom comes."
 rev_holy_monarchy_resolve_tt: "§YStability§! and §YWar Support§! are restored to a minimum of §G65%§! on consecration and each day, including compensation for war and national-spirit penalties.\nUnlocks the §YHoly Monarchy§! shared focus branch."
 REV_HM_holy_monarchy: "Thy Kingdom Comes"
 REV_HM_holy_monarchy_desc: "Our consecration gives the nation a common purpose. Crown and people will rebuild the economy, renew the churches and prepare the armed forces to defend the coming Kingdom."
 REV_HM_light_industry_investments: "Industry for the Common Good"
 REV_HM_light_industry_investments_desc: "Adapt the shared industrial investment program to the royal settlement, expanding civilian production and the energy supply that sustains it."
 REV_HM_agricultural_district_subsidization: "Stewardship of the Land"
 REV_HM_agricultural_district_subsidization_desc: "Support the farmers and landowners who feed the realm, investing in an additional agricultural district."
 REV_HM_energy_sector: "Power the Realm"
 REV_HM_energy_sector_desc: "Reliable energy is essential to reconstruction. Expand generating capacity and fuel production under the shared energy investment program."
 REV_HM_heavy_industry_investments: "Royal Armaments Works"
 REV_HM_heavy_industry_investments_desc: "Copy the shared heavy-industry program to establish the armaments factories needed to defend our consecrated nation."
 REV_HM_refitting_the_military_industry: "Renew the Royal Arsenals"
 REV_HM_refitting_the_military_industry_desc: "Continue military industrial investment, expanding and refitting the factories that supply our armed forces."
 REV_HM_build_churches: "Build the Churches of the Kingdom"
 REV_HM_build_churches_desc: "Renew parish life and support the clergy. As in the shared church-building program, this strengthens stability and the standing of religious institutions."
 REV_HM_build_primary_schools: "Parish Schools"
 REV_HM_build_primary_schools_desc: "Extend the shared primary-school investment program through the realm, improving literacy and research."
 REV_HM_assure_access_to_education: "Learning for Every Household"
 REV_HM_assure_access_to_education_desc: "Education must reach beyond the privileged few. Expand access to learning and improve national literacy."
 REV_HM_expand_the_universities: "Universities of the Realm"
 REV_HM_expand_the_universities_desc: "Support institutions of higher learning so the renewed nation can sustain its own research and technical education."
 REV_HM_industrial_research_task_forces: "Royal Research Commission"
 REV_HM_industrial_research_task_forces_desc: "Bring industrial and military researchers together under a commission dedicated to improving the realm's technological capabilities."
 REV_HM_domestic_vehicle_research: "Royal Vehicle Proving Grounds"
 REV_HM_domestic_vehicle_research_desc: "Establish a land research facility using the shared vehicle-development program."
 REV_HM_domestic_naval_research: "Royal Naval Research Establishment"
 REV_HM_domestic_naval_research_desc: "A coastal realm needs the means to develop modern warships. Establish a naval research facility."
 REV_HM_domestic_aircraft_research: "Royal Aeronautical Institute"
 REV_HM_domestic_aircraft_research_desc: "Establish an air research facility to develop the aircraft that will defend the realm's skies."
 REV_HM_protect_the_papacy: "Protect the Papacy"
 REV_HM_protect_the_papacy_desc: "Guarantee the independence of the Holy See, or give the papacy refuge if it has lost its state."
 REV_HM_found_the_catholic_league: "Decentralize Command"
 REV_HM_found_the_catholic_league_desc: "Unifying politically doesn't mean we should have a centralized command structure. We should decentralize command as much as possible and allow units to take the initiative."
 REV_HM_eldest_daughter_of_the_church: "The Eldest Daughter of the Church"
 REV_HM_eldest_daughter_of_the_church_desc: "Restore the Church's standing in government and give the clergy a greater role in public life."
 REV_HM_the_tenth_crusade: "The Tenth Crusade"
 REV_HM_the_tenth_crusade_desc: "This time it is a legitimate crusade, not intended for conquest but to bring mercy and security to all people in those states, especially Christians suffering under Alex's control in Israel and Egypt where there once were millions of Coptic Christians only a year ago."
 REV_HM_modern_chivalry: "Modern Chivalry"
 REV_HM_modern_chivalry_desc: "Revive the royal cavalry tradition by making armored formations the spearhead of the army."
 REV_HM_the_kings_camelots: "The King's Camelots"
 REV_HM_the_kings_camelots_desc: "Organize royalist activists into a state security service to tighten surveillance and counter opposition to the crown."
 REV_HM_pillar_of_counterterrorism: "Pillar of Counterterrorism"
 REV_HM_pillar_of_counterterrorism_desc: "Prepare specialist forces to confront terrorism and support partner nations facing extremist threats."
 REV_HM_the_french_foreign_legion: "The French Foreign Legion"
 REV_HM_the_french_foreign_legion_desc: "Adopt the French Foreign Legion's model of recruiting volunteers from abroad into a disciplined elite force."
 rev_hm_catholic_league: "Catholic League"
 rev_hm_papal_refuge: "Papal Refuge"
 rev_hm_papal_refuge_desc: "The crown shelters the Holy See after the loss of its territorial state."
 rev_hm_decentralized_command: "$REV_HM_found_the_catholic_league$"
 rev_hm_decentralized_command_desc: "$REV_HM_found_the_catholic_league_desc$"
 rev_hm_camelots_agency: "$REV_HM_the_kings_camelots$"
 rev_hm_camelots_agency_desc: "$REV_HM_the_kings_camelots_desc$"
 rev_hm_camelots: "$REV_HM_the_kings_camelots$"
 rev_hm_camelots_desc: "$REV_HM_the_kings_camelots_desc$"
 rev_hm_armoured_chivalry: "$REV_HM_modern_chivalry$"
 rev_hm_armoured_chivalry_desc: "$REV_HM_modern_chivalry_desc$"
 rev_hm_crusade_land: "Land Crusade Preparations"
 rev_hm_crusade_land_desc: "The army is preparing to operate in the heat and supply conditions of the eastern Mediterranean."
 rev_hm_crusade_naval: "The Maritime Crusade"
 rev_hm_crusade_naval_desc: "The fleet is preparing to support amphibious operations in the Holy Land."
 rev_holy_monarchy_focus.1.t: "An Invitation to the Catholic League"
 rev_holy_monarchy_focus.1.d: "[rev_hm_league_inviter.GetNameDefCap] has invited us to join the Catholic League."
 rev_holy_monarchy_focus.1.a: "Join the Catholic League."
 rev_holy_monarchy_focus.1.b: "Decline the invitation."
 rev_holy_monarchy_focus.2.t: "Prepare for the Tenth Crusade"
 rev_holy_monarchy_focus.2.d: "The crown must choose a route to the Holy Land. Lebanon could provide a base for a land expedition. A naval expedition will require investment in amphibious capabilities."
 rev_holy_monarchy_focus.2.a: "Seek a protectorate in Lebanon."
 rev_holy_monarchy_focus.2.b: "Prepare for a naval expedition."
 rev_holy_monarchy_focus.3.t: "A Proposal for a Protectorate"
 rev_holy_monarchy_focus.3.d: "[rev_hm_crusade_sponsor.GetNameDefCap] has asked Lebanon to accept its protection and serve as the staging ground for an expedition to the Holy Land."
 rev_holy_monarchy_focus.3.a: "Accept the protectorate."
 rev_holy_monarchy_focus.3.b: "Lebanon will remain independent."
