l_english:
 rev_holy_monarchy: "Holy Monarchy"
 rev_holy_monarchy_desc: "Consecrated to the service of God, our nation stands within the Holy Monarchy. Our stability and resolve are unshakeable: no matter how bad it gets, we know Thy Kingdom comes."
 rev_holy_monarchy_resolve_tt: "§YStability§! and §YWar Support§! are restored to a minimum of §G65%§! on consecration and each day, including compensation for war and national-spirit penalties.\nUnlocks the §YHoly Monarchy§! shared focus branch."
 REV_HM_holy_monarchy: "Thy Kingdom Comes"
 REV_HM_holy_monarchy_desc: "Our consecration gives the nation a common purpose. Crown and people will rebuild the economy, renew the churches and prepare the armed forces to defend the coming Kingdom."
 REV_HM_light_industry_investments: "Industry for the Common Good"
 REV_HM_light_industry_investments_desc: "Adapt the shared industrial investment program to the royal settlement, expanding civilian production and the energy supply that sustains it."
 REV_HM_agricultural_district_subsidization: "Stewardship of the Land"
 REV_HM_agricultural_district_subsidization_desc: "Support the farmers and landowners who feed the realm, investing in an additional agricultural district."
 REV_HM_energy_sector: "Power the Realm"
 REV_HM_energy_sector_desc: "Reliable energy is essential to reconstruction. Expand generating capacity and fuel production under the shared energy investment program."
 REV_HM_heavy_industry_investments: "Royal Armaments Works"
 REV_HM_heavy_industry_investments_desc: "Copy the shared heavy-industry program to establish the armaments factories needed to defend our consecrated nation."
 REV_HM_refitting_the_military_industry: "Renew the Royal Arsenals"
 REV_HM_refitting_the_military_industry_desc: "Continue military industrial investment, expanding and refitting the factories that supply our armed forces."
 REV_HM_build_churches: "Build the Churches of the Kingdom"
 REV_HM_build_churches_desc: "Renew parish life and support the clergy. As in the shared church-building program, this strengthens stability and the standing of religious institutions."
 REV_HM_build_primary_schools: "Parish Schools"
 REV_HM_build_primary_schools_desc: "Extend the shared primary-school investment program through the realm, improving literacy and research."
 REV_HM_assure_access_to_education: "Learning for Every Household"
 REV_HM_assure_access_to_education_desc: "Education must reach beyond the privileged few. Expand access to learning and improve national literacy."
 REV_HM_expand_the_universities: "Universities of the Realm"
 REV_HM_expand_the_universities_desc: "Support institutions of higher learning so the renewed nation can sustain its own research and technical education."
 REV_HM_industrial_research_task_forces: "Royal Research Commission"
 REV_HM_industrial_research_task_forces_desc: "Bring industrial and military researchers together under a commission dedicated to improving the realm's technological capabilities."
 REV_HM_domestic_vehicle_research: "Royal Vehicle Proving Grounds"
 REV_HM_domestic_vehicle_research_desc: "Establish a land research facility using the shared vehicle-development program."
 REV_HM_domestic_naval_research: "Royal Naval Research Establishment"
 REV_HM_domestic_naval_research_desc: "A coastal realm needs the means to develop modern warships. Establish a naval research facility."
 REV_HM_domestic_aircraft_research: "Royal Aeronautical Institute"
 REV_HM_domestic_aircraft_research_desc: "Establish an air research facility to develop the aircraft that will defend the realm's skies."
