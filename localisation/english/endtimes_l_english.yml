 SAU_MECCAPACT_neutrality_DEF: "Saudi Arabia"
 SAU_MECCAPACT_neutrality_ADJ: "Saudi Arabian"

 endtimes.26.t: "Iran Joins the MeccaPact"
 endtimes.26.d: "Iran has long been an enemy of many MeccaPact countries, but now sees an opportunity for unity with the rest of the region. With China having just joined the new order, Iran has decided to join as well.\n\nIran agrees to a white peace with every country it is fighting before joining the pact. The Axis of Resistance is dissolved. Iraq, Free Syria and Hezbollah are freed from Iranian rule if they remain Iranian subjects, and join Iran in the MeccaPact as independent members wherever they still exist and are free to join. If Hamas still exists, it adopts Emerging Autocracy and joins the pact.\n\nWhere the governments still exist, the United Arab Emirates signs a non-aggression pact with Saudi Arabia. Saudi Arabia takes Houthi Yemen as a puppet. Syria annexes Rojava."
 endtimes.26.a: "The Middle East united."
 endtimes.28.t: "A Coup in Israel"
 endtimes.28.d: "WNN reports that a coup has brought a new government to power in Israel. Days after the Vatican was stormed, with Israel beset on every side by the One Faith, One World Alliance, a group of wealthy Israeli businessmen announced that a deal had been reached with the Alliance.\n\nThe agreement sets out a framework for peaceful coexistence through a two-state system and the rebuilding of Gaza. Eitan Ben-Ami has been installed as the new president, and Jerusalem is to become an open Holy City once again for all believers.\n\nIsrael joins the Saudi-led MeccaPact, and its new leadership enters the Cabal. The existing Palestinian and Gaza governments are brought into the same alliance and network as part of the settlement."
 endtimes.28.a: "The new president accepts the settlement."
 endtimes.29.a: "A new order takes hold in the Holy Land."

 endtimes.30.t: "The Moment of Desolation"
 endtimes.30.d: "The Pope was assassinated and the apostasy has spread worldwide. Much of the world now stands in alliance with the Biblical Beast of Revelation who calls himself god.\n\nAcross the Americas and Europe, civil war threatens to break out. Governments fracture, loyalties divide, and the remaining opposition faces a world increasingly united under Alex's authority.\n\nChina is now preparing to formally join Alex's alliance. As the One Faith, One World order extends its reach, the world stands at the moment of desolation."
 endtimes.30.a: "The world stands on the brink."

 endtimes.31.t: "China Joins the MeccaPact"
 endtimes.31.d: "China has maintained close links and cooperation with Alex's Cabal for many years. Now, with the old world gone and trade with the West at an end, Beijing has announced that it is casting aside its remaining restraints and formally joining the Saudi-led MeccaPact, Alex's One Faith, One World Alliance.\n\nChina is fully implementing the SOLOMON world banking system and currency. Participation brings an 80 percent debt write-off at adoption and a permanent 4 percent bonus to weekly revenue, binding its economic future to Alex's new order.\n\nFollowing its entry into the alliance, China has declared war on the Philippines, Taiwan and Japan. Beijing's alignment with Alex is now matched by a military offensive across East Asia."
 endtimes.31.a: "China commits to the new order."
 endtimes.32.a: "War spreads across East Asia."

 endtimes.33.t: "The Philippines Joins the East Asian Alliance"
 endtimes.33.d: "The Philippines has joined Japan's existing East Asian alliance. The accession strengthens the bloc as tensions with the MeccaPact rise."
 endtimes.33.a: "A stronger alliance in the East."

 endtimes.35.t: "Israel Strikes Iran with a Nuclear Weapon"
 endtimes.35.d: "WNN reports that Israel has detonated a nuclear weapon in Khuzestan as Iranian forces and their allies press the war against Israel.\n\nThe Israeli government has warned that it will continue using nuclear weapons until Iran and its allies withdraw and end their offensive. Tehran, it declares, will be next.\n\nThe threat of further nuclear strikes now hangs over the region as the world waits for Iran's response."
 endtimes.35.a: "Tehran has been warned."
 endtimes.36.t: "A Ceasefire After the Nuclear Strike"
 endtimes.36.d: "One day after the nuclear explosion in Khuzestan, Iran and its dependent governments have agreed to a white peace with Israel and Jordan.\n\nThe fighting ends without a peace-conference settlement. Iran's existing puppets remain under its control for now."
 endtimes.36.a: "The offensive ends."
 endtimes.37.t: "Israel Nukes Iran"
 endtimes.37.d: "Iran took a calculated risk: either Israel would not actually use a nuclear weapon, or Tehran was prepared to absorb a single strike. The explosion in Khuzestan has exposed the consequences of that gamble.\n\nIran apparently does not yet have a nuclear weapon of its own; otherwise, it would probably have announced it by now. Israel's warning that Tehran would be next has been followed by a ceasefire.\n\nIran and its dependent governments have made white peace with Israel and Jordan. Iran's chain of puppets remains intact for now."
 endtimes.37.a: "A nuclear warning brings a fragile peace."

 endtimeseal.1.t: "The First Seal"
 endtimeseal.1.d: "I looked, and there was a white horse, and its rider had a bow. He was given a crown, and he rode forth victorious to further his victories.\n\nThe world order is crumbling and all the pent up potential conflicts are getting ready to burst."
 endtimeseal.1.a: "Soon war won't be so far away"

 endtimeseal.2.t: "The Second Seal"
 endtimeseal.2.d: "Another horse came out, a red one. Its rider was given power to take peace away from the earth, so that people would slaughter one another. And he was given a huge sword.\n\nAll Hell has broken loose, all the simmering conflicts are now full blown."
 endtimeseal.2.a: "The world has gone crazy"

 endtimeseal.3.t: "The Third Seal"
 endtimeseal.3.d: "I looked, and there was a black horse, and its rider held a scale in his hand. “A ration of wheat costs a day’s pay, and three rations of barley cost a day’s pay. But do not damage the olive oil or the wine.\n\nEven if bombs aren't falling near you, fuel and food are getting scarce or very expensive.  Global markets are disrupted everywhere."
 endtimeseal.3.a: "Trade has broken down on top of local crop failures"

 endtimeseal.4.t: "The Fourth Seal"
 endtimeseal.4.d: "I looked, and there was a pale green horse. Its rider was named Death, and Hades accompanied him. They were given authority over a quarter of the earth, to kill with sword, famine, and plague, and by means of the beasts of the earth.\n\nThe current population of the world is only possible with peace and trade, when chaos is everywhere, areas without local food supply are cut off.  That and all the disease we once conquered are showing up again without services to stop them."
 endtimeseal.4.a: "On our way to 2 Billion Dead"

 endtimeseal.5.t: "The Fifth Seal"
 endtimeseal.5.d: "“How long will it be, holy and true master, before you sit in judgment and avenge our blood on the inhabitants of the earth?”\n\nOn top of the War, Famine, Disease and Natural Disasters, add religious persecution, as the One Faith actively persecutes anyone who opposes it."
 endtimeseal.5.a: "Is anywhere safe, when will this end?"
 endtimes.38.t: "Global Ceasefire"
 endtimes.38.d: "After the Miracle, the world remains shaken by the Warning and the revelation of each person's sins and the state of their soul. The Miracle has renewed that conviction. Soldiers are refusing to fight, and generals are afraid to order attacks.\n\nAlex who gained some notice by predicting the Miracle, says it's part of his mission to bring peace to the world. The major conflicts, if not already resolved, come to a halt in white peace. Fighting between the United States and Canada, California, and their WestNATO allies, between Iran and Israel, and between China and the Philippines, Japan, Taiwan, and South Korea falls silent, wherever those wars are still active."
 endtimes.38.a: "God wouldn't want us fighting"

 endtimes_russia_ceasefire_no_report: ""
 endtimes_russia_ceasefire_report: "\n\nRussia has agreed to a change of government that will no longer be an adversary to the West. Dmitri Leonidovich Orlov heads a pro-Western transitional government, with elections scheduled for October 9, 2028. Poland, Germany, Finland, and Alex personally will have a say in all government post appointments and state affairs during the transition. Russia remains in the Cabal.\n\nEstonia, Latvia, and Lithuania regain their freedom. Kaliningrad is transferred to Lithuania and integrated as a core part of the country. Belarus is released from puppet status, and Ukraine regains its full borders, including Crimea. The CSTO is disbanded.[GetEndtimesFarEastCeasefireReport]"
 endtimes_russia_far_east_ceasefire_report: " The Chinese-controlled Far East is returned to Russia."

 endtimes.39.t: "[GetEndtimesRussiaOctoberChoiceTitle]"
 endtimes.39.t_standard: "Russia at a Crossroads"
 endtimes.39.t_coup: "Pro-Alexian Coup"
 endtimes.39.d_coup: "Russian oligarchs and clerics see their future closely aligned with Alex and his Pact, and anyone who does not like that can leave.\n\nThey are backing a coup to remove the current government and install Dmitri Leonidovich Orlov. Under his rule, elections will be suspended and Russia will join the MeccaPact, adopt Western Christianity and the SOLOMON system, write off half its debt and empty its remaining manpower reserves. Alternatively, we can hold elections and choose a new pro-Western president."
 endtimes.39.d: "[GetEndtimesRussiaOctoberChoiceDescription]"
 endtimes.39.d_interim: "The elections promised by the Western-backed transitional government are approaching. Since the Russian Orthodox Church joined with Rome and the Pope visited, many Russians have turned toward the West. Yet the One Faith remains popular, and supporters of autocratic rule demand that the interim president stay in power.\n\nWe can suspend elections, retain the current president and join the MeccaPact. This brings Western Christianity, the SOLOMON currency system and a write-off of half our debt, but ends the democratic transition and empties our remaining manpower reserves. Alternatively, we can hold elections, replace the interim president with a new pro-Western president and bring stability to 80%."
 endtimes.39.d_no_interim: "Russia faces a choice between autocratic order and a democratic opening. The One Faith has gained many followers, while the upheaval abroad has strengthened calls for closer ties with the West.\n\nWe can suspend elections, retain the current president and join the MeccaPact. This brings Western Christianity, the SOLOMON currency system and a write-off of half our debt, but empties our remaining manpower reserves. Alternatively, we can hold elections, replace the current president with a new pro-Western president and bring stability to 80%."
 endtimes.39.a: "[GetEndtimesRussiaOctoberCoupOption]"
 endtimes.39.a_suspend: "Suspend elections and join the MeccaPact."
 endtimes.39.a_coup: "Install Orlov and join the MeccaPact."
 endtimes.39.b: "Hold elections and elect a new pro-Western president."
 endtimes.43.t: "Russia Chooses Elections"
 endtimes.43.d: "Russia has rejected calls to suspend elections and join the MeccaPact. Voters have chosen a new pro-Western president, [SOV.GetLeader], replacing the previous head of government.\n\nThe new administration has pledged to preserve democratic elections and pursue closer relations with the West. Stability has reached 80% as Russia begins a new political chapter."
 endtimes.43.a: "A new mandate for Russia."
 endtimes.40.t: "More Trouble in Russia"
 endtimes.40.d: "[GetEndtimesRussiaOctoberCoupDescription]"
 endtimes.40.d_coup: "Russian oligarchs and clerics have aligned themselves with Alex and his Pact. A pro-Alexian coup has removed the previous government and installed Dmitri Leonidovich Orlov as the head of a Emerging autocracy. Anyone who rejects the new order is told they can leave.\n\nElections have been suspended. Russia joins the MeccaPact, adopts Western Christianity and the SOLOMON system, and receives a write-off of half its debt. Its remaining manpower reserves have been emptied."
 endtimes.40.a: "Russia turns toward the new order."

 endtimes.41.t: "Christmas Consecration"
 endtimes.41.d: "Life is not normal. Major disasters are happening, and non-Christians and followers of Alex are becoming very militant. Some areas are overrun. It is not quite a civil war, but there are disruptions in the fabric of society.\n\nWe have decided that we must go back to the dollar and remove all ties to the One Faith and the SOLOMON payment system. The western states do not agree and are looking to split off again.\n\nCalifornia becomes independent and leaves all military factions, adopting the SOLOMON system, the Cabal and the Mark. The United States rejects Alex's systems, removes the Cabal and receives Angelic Protection with its Christmas consecration."
 endtimes.41.a: "Consecrate the nation. Return to the dollar."
 endtimes_usa_defensive_mission_tt: "§RThe restored United States has renounced aggression and cannot justify new wars.§!"

 endtimes_usa_beast_systems_banned_tt: "The United States has not abolished the Beast financial systems."

 endtimes_nato_reunification_no_report: ""
 endtimes_nato_reunification_report: "\n\nThe temporary WestNATO split has ended. Its surviving members have returned to NATO, restoring a single alliance."

 endtimes.40.d_interim: "Russia was supposed to hold an election this month. Since the Russian Orthodox Church joined with Rome and the Pope visited, the people have begun leaning in a pro-Western direction. Yet the One Faith is also very popular, and many are naturally drawn to autocrats.\n\nThe world is a mess, and Germany in particular has too many problems at home to maintain close oversight. In a coup, Russia's elections have been suspended. The interim leader will remain in power, now heading a Emerging autocracy.\n\nRussia adopts Western Christianity as its official religious alignment and joins the MeccaPact. A SOLOMON currency agreement writes off half of its current debt and brings the benefits of the global banking system. The promised democratic transition has come to an end."
 endtimes.40.d_no_interim: "Even without the Western-backed interim government, Russia has not escaped the upheaval spreading across the world. The One Faith is very popular, and many Russians are drawn to the promise of autocratic order.\n\nWith the world in chaos and Germany occupied by problems at home, a coup has swept aside the remaining restraints on power. The current leader remains in charge, now heading a Emerging autocracy. Elections are suspended indefinitely.\n\nRussia adopts Western Christianity as its official religious alignment and joins the MeccaPact. It receives the SOLOMON currency system and a write-off of half its current debt, while the armed forces report that no further manpower reserves are available. The Kremlin has committed itself to the new global order."
