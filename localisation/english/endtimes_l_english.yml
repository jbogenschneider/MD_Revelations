l_english:
 endtimes.15.t: "Alex's Puppet Takes Over"
 endtimes.15.d: "Vladimir Putin and Russia were in Alex's Cabal, but Putin entirely pursed his own Imperial Ambitions. Alex knew Russia would fail but create a power vacume that his people would quickly fill.  Now Alex has total control of Russia, with the full support of the oligarchy.\n\nHe brings a vast personal fortune, a complete artificial intelligence system, and a new currency. Russia is starting over, free of international debt and ready to put its oil revenues to work rebuilding the country. Through Alex's global business ties, especially in the Middle East, Russia will soon be back in business.  Alex still uses another Russian Oligarch as the actual figurehead in public."
 endtimes.15.a: "Russia begins again under Alex."

 endtimes.44.t: "USA Returns to Normal"
 endtimes.44.d: "The Warning has settled into the minds of Americans, and the North American Civil War is over. The USA is going back to normal. Trump and Vance have been removed, and elections are set for November.\n\nSpeaker Hakeem Jeffries becomes interim president under the restored constitutional government. Peace with Iran is concluded if the two countries are still at war."
 endtimes.44.a: "Restore constitutional government."
 endtimes.1.t: "For Your Eyes Only"
 endtimes.1.d: "On October 2, 2024, your leader personally entered into an agreement with the leader of an international shadow organization. The cabal of a very select group of very powerful, wealthy and deologically aligned leaders.  The cabal promotes common economic interests, especially personal ones, through backchannel banking and investments. Secrecy is of the utmost importance.\n\nThe agreement promises benefits to all parties: subverting democracies, propaganda, populism, sharing technology, securing infrastructure and energy deals, as well as, advancing artificial intelligence, particularly for military applications. Members are expected to help advance these shared objectives.\n\nKnowledge of the organization and any links to it must be kept to an absolute minimum. Alongside heads of state, its membership includes influential and fabulously rich oligarchs whose wealth, connections, military contacts and influence are essential to achieving these objectives."
 endtimes.1.a: "Keep this strictly confidential."
 endtimes.2.t: "The Price of Victory"
 endtimes.2.d: "For the leader of the United States, the timing of October 2, 2024, was no coincidence. With the 2024 presidential election only a few weeks away, the leader of the organization approached candidate Donald Trump. The organization deliberately has no name, but the game will call it the Cabal.\n\nThe offer was a guaranteed electoral victory in the 2024 election, secured with the help of all the other members. In exchange, Trump would commit to full participation in the organization's objectives, including supporting the interests of its members as much as possible.\n\nHe would also need to swear a measure of fealty to its leader. Trump was assured that their interests were already very closely aligned."
 endtimes.2.a: "The understanding remains confidential."

 endtimes_cabal: "Cabal"
 endtimes_cabal_desc: "An inner circle of heads of state and influential oligarchs shares technology, capital, and influence through secret agreements. Electronics research speed is increased by 5%. Stability and war support are maintained at a minimum of 30% while membership lasts."
 endtimes_cabal_support_floor: "Dictators, Oligarchs, Equity Funds, the biggest players are all 2 degrees of each other, and united in greed"

 endtimes.3.t: "The Great Warning"
 endtimes.3.d: "The prophecy of Garabandal, has happened. Every person on Earth has seen the state of their soul, their sins and will know Jesus is God.  It's an Illumination of Concious.\n\nSome people died during the event.  The world will never be the same, everyone has been confronted by the supernatural."
 endtimes.3.a: "The mini-Judgement and the second of the Medjugorje's secrets"
 endtimes.4.t: "The Miracle"
 endtimes.4.d: "A permanent miracle has appeared at numerous locations around the Earth where Marian Apparitians have previously occured like Garabandal, Gaudelupe, Fatima, Medjugorje and Lordes.  It can be described as suspended Cross that can be seen and photographed, but strangely cannot be touched. It is not a projection.\n\nSick people who were present at these locations at the time of the Miracle claim to have been cured.\n\nChurches are strained with so many returning people.  A middle-eastern businessman gained noteriety by predicting the date and time it would happen, although it's believed he had learned the secret the seers knew somehow."
 endtimes.4.a: "A Miraculous Sign Appears"

 endtimes.19.t: "The Eastern Orthodox Rejoin"
 endtimes.19.d: "In the days following the Miracle, a historic reunion has begun. The Eastern churches, separated from the Roman Catholics for roughly a millennium and divided largely along national lines, are looking once more to the Pope as leader of the flock.\n\nTheir ancient liturgies, local traditions, and everyday parish life continue much as before. Yet the political meaning is profound: Greece, Romania, and Ukraine now feel far more united with northern and western Europe, sharing a renewed sense of Christian fellowship and common purpose.\n\nRussia's Orthodox Church has not yet committed to the union. Looks like Easter will be a common date this year."
 endtimes.19.a: "A divided flock begins to reunite."

 endtimes.5.t: "A New Church Begins to Emerge"
 endtimes.5.d: "The story of Alex and the Prophet as he's now referred to is spreading rapidly online and in media.  With the Warning and Miracle, everyone on earth is aware of the supernatural, and Alex's ability to perform signs and wonders is capturing the moment.  The One Faith as it's now called by Alex's followers, recruits clerics of other faiths like Islam, Hinduism and Buddahism and aligns it with the experience of God they just experienced.  Western Churches are opposed to this message but there are many converts in the west as well especially among previously non-religious."
 endtimes.5.a: "Alexians? The One Faith Movement"

 endtimes.6.t: "Alex Announces a Prediction"
 endtimes.6.d: "A prominant businessman who until this moment was basically unknown announced on social media predicting there soon would be a Great Warning event for all Mankind, followed later by a great visible Miracle.  Alex, who is well connected quickly had this announcement shared by super influencers."
 endtimes.6.a: "I wonder what it'll be?"

 endtimes.666.t: "Alex rises from the Dead"
 endtimes.666.d: "Three days ago an assassin attacked a wealthy businessman.\n\nThe attacker, a Catholic priest, stabbed Alex with a dagger. Alex, is known by another name, but from now on will be known simply as Alex.  He was pronounced dead from his wounds, but today he later emerged from the morgue, fully healed, and said he was given a special purpose by God to unite the faiths of the world in peace.  At least one Bishop, is claiming to have also received messages from God regarding Alex's mission and predicted soon there would be a Great Warning event for all Mankind, followed later by a great visible Miracle."
 endtimes.666.a: "A new Prophet in the Holy Land"

 endtimes.16.t: "[ROOT.GetName] Joins the MeccaPact"
 endtimes.16.d: "[ROOT.GetName] has committed itself to Alex's new order. Previous alliance commitments are cast aside as our country joins the MeccaPact under Saudi Arabian leadership.\n\nMorocco, Algeria, Egypt, Libya, Tunisia, Jordan, Saudi Arabia, Oman, Yemen, Pakistan, Bangladesh, Bahrain, Qatar, Iraq, Kuwait, Free Syria, Indonesia, Brunei, Turkmenistan, Azerbaijan, Uzbekistan, Tajikistan, Kyrgyzstan and the United Arab Emirates stand together in this realignment. Their leaders enter the Cabal, binding their fortunes to Alex and his network of allied governments and business interests.\n\nWars against any other countries are ended in white peace.\n\nParticipants adopt the SOLOMON one-world currency, gaining a permanent 4% bonus to gross weekly revenue. New adopters receive 30% debt forgiveness; countries already using SOLOMON receive no additional debt write-off. Russia is not part of this realignment."
 endtimes.16.a: "Our future lies with Alex."

 endtimes.20.t: "Pope Election, One Faith try to Infiltrate the Church"
 endtimes.20.d: "The One Faith has spread worldwide especially with the help of social media and because Alex broadcasts constantly reaching hundreds of millions of viewers. It turns out Alex has some support among Bishops and Cardinals and an attempt was made to advance the Prophet, but he was swiftly rejected. On the bright side there's a Great New Pope, but there is now an Anti-Pope too."
 endtimes.20.a: "Long live Pope Peter§R"

 endtimes.7.t: "A hit job on the Papacy"
 endtimes.7.d: "Christian churches are calling the One Faith a heresy and the Vatican was getting ready to make a formal decree stating their teachings to be very inconsistent with Christianity and that Christians should not add the Prophet's message to it.  On Halloween night a large group of Pro-One Faith protesters, 1000s, most in costumes flash mobbed the Vatican.  It was cover for a group of assassins who stormed the Pope's apartment in the Vatican.\n\nPope Leo XVI and many other clergy are dead. Saint Peters was partially burned and many from the Vatican security like the Swiss Guard were also killed.  Many questions regarding how Italy security forces could have had such a breakdown in Rome."
 endtimes.7.a: "The Holy Father has been Martyred"

 endtimes.8.t: "A Dirty Bomb Outside Jerusalem"
 endtimes.8.d: "A dirty bomb has exploded just outside Jerusalem. Iran is suspected, and Israel has vowed retribution."
 endtimes.8.a: "The world awaits Israel's response."
 endtimes.9.t: "Tehran Suffers a Nuclear Strike"
 endtimes.9.d: "Israel has carried out a nuclear strike on Tehran in retaliation for the dirty bomb attack outside Jerusalem. The Iranian capital has suffered the destructive effects of an atomic explosion."
 endtimes.9.a: "A catastrophe for Tehran."

 endtimes.10.t: "Europe's Battle Lines"
 endtimes.10.d: "Some People know what's going on, others just want the world back to the way it was.  The world is dividing into two camps: areas with Christian majority and countries in Alex's alliance."
 endtimes.10.a: "Civil Wars are breaking out"

 endtimes.11.t: "A New King for France"
 endtimes.11.d: "Five days after the outbreak of civil war, a predominantly Christian movement backed by loyal elements of the French Army has ousted Marine Le Pen and the National Front. Those loyal to Alex are driven from power as the surviving French government turns to a monarchy.\n\nTheir leader is General Geoffroy Saint-Michel of the French Army. In the presence of his loyal subordinates and many refugees, Saint Michael appeared to him and delivered this message:\n\n'The time for all to unite in Jesus' name is now. Geoffroy is chosen by Jesus as your monarch, and his son Henri as the heir, to see you through a little while longer. Geoffroy, he has been prepared his whole life for this vocation."
 endtimes.11.a: "France welcomes its new king."

 endtimes.14.t: "A Royal Chancellor for Germany"
 endtimes.14.d: "Germany has embraced the royal settlement proclaimed by King Geoffroy Saint-Michel of France. By the French monarch's appointment, General Matthias von Falkenberg takes office as Chancellor, entrusted with governing Germany under the new monarchy.\n\nGermany retains its sovereignty, its armed forces, and leadership of NATO. France and Germany stand together as full allies in the struggle against the Beast. The Chancellor's royal appointment does not make Germany a French subject.\n\nThe settlement also redraws Central Europe's borders. Austria is incorporated into Germany, while Mecklenburg-Vorpommern, Brandenburg, Berlin, Saxony-Anhalt, Saxony, and Thuringia form an independent East Germany, with its capital in Berlin. The new state inherits Germany's current technology and recreates the military formations historically based in its territory. Germany's government moves to Bonn."
 endtimes.14.a: "The Chancellor takes his oath."

 endtimes.17.t: "[ROOT.GetName] Joins the Royal Settlement"
 endtimes.17.d: "Following the restoration of the French monarchy under King Geoffroy Saint-Michel, Spain and Portugal have agreed to join the royal settlement.\n\nOur government adopts monarchist rule while retaining its present national leader, who will continue to govern under the new political order. Elections are abolished as the country commits itself to the monarchy.\n\nSpain and Portugal confirm their place in NATO, returning to the alliance if necessary."
 endtimes.17.a: "We join the royal settlement."

 endtimes.18.t: "[ROOT.GetName] Joins the Royal Settlement"
 endtimes.18.d: "Ten days after the restoration of the French monarchy under King Geoffroy Saint-Michel, the United Kingdom and Ireland have agreed to join the royal settlement.\n\nOur government adopts monarchist rule while retaining its present national leader. Elections are abolished under the new political order.\n\nIreland joins NATO, and the United Kingdom confirms its place in the alliance, returning if necessary. Together with France, Germany, Spain, and Portugal, they stand within the same alliance."
 endtimes.18.a: "We join the royal settlement and NATO."

 endtimes.12.t: "We are living the Book of Revelation"
 endtimes.12.d: "There is no denying it any longer: the Book of Revelation is now unfolding in real time, you can feal it, like goodness has left the world. The religion of Alex has spread throughout the world, and there are signs of a persecution to come.\n\nMost Christians aggree they must gather together for safety:\n\n§YMark 13:14§!\n\"When you see ‘the abomination that causes desolation’ standing where it does not belong—let the reader understand—then let those who are in Judea flee to the mountains.\"\n\n§YDaniel 9:27 — The prophecy Jesus references§!\n\"He will confirm a covenant with many for one ‘seven.’ In the middle of the ‘seven’ he will put an end to sacrifice and offering. And at the temple he will set up an abomination that causes desolation, until the end that is decreed is poured out on him.\"\n\n§YRevelation 12:6 — The escape from the dragon/beast§!\n\"The woman fled into the wilderness to a place prepared for her by God, where she might be taken care of for 1,260 days.\""
 endtimes.12.a: "Hold firm to Jesus Christ."

 endtimes.13.t: "A Bad Harvest"
 endtimes.13.d: "The super El Niño of 2026 brought lower harvests across Asia and Africa, compounded by the failure to export Black Sea grain because of war.\n\nIn 2027, unfavorable conditions also struck the Western world, ushering in famine in parts of Africa and Southeast Asia.\n\nThese droughts, combined with earthquakes and the need for constant relief efforts, are placing an especially heavy strain on the developing world. More countries are struggling to survive as functioning states."
 endtimes.13.a: "The world faces a growing crisis."

 endtimes.21.t: "Famine and Other Disasters"
 endtimes.21.d: "Starting with the super El Niño of 2026 and continuing through 2027, 2028, and now 2029, the world has endured a nonstop series of droughts, floods, earthquakes, and other disasters, now compounded by the Great Reset.\n\nFamine and plague are running rampant through the developing world. These are not new diseases, but old and existing ones that have spiraled out of control. HIV, for example, is widespread across Africa, Russia, and Southeast Asia.\n\nOver a billion fewer people are alive today than in 2027, and the crisis is out of control in many areas.\n\nCountries suffering from famine and disease now have a national spirit reflecting their plight."
 endtimes.21.a: "The suffering continues."

 endtimes.22.t: "Civil War in France"
 endtimes.22.d: "After the incident at the Vatican, Marine Le Pen's government revealed that it was allied with Alex and intended to bring France into the SOLOMON system.\n\nThe socialist far left was the first to revolt. Its opposition was not driven by concern for the Vatican, but because that system was incompatible with its politics."
 endtimes.22.a: "France descends into civil war."

 endtimes_famine_and_disease: "Famine and Disease"
 endtimes_famine_and_disease_desc: "Repeated harvest failures, disease outbreaks, and collapsing relief networks have left the population struggling for survival. Essential civilian needs consume the country's productive capacity."
 endtimes_famine_consumption_floor: "Famine and Disease"
 endtimes_famine_consumption_floor_tt: "Consumer-goods demand is maintained at a minimum of §R90%§!, recalculated daily. Any higher demand is preserved."

 endtimes.23.t: "Saudi Arabia, Turkey and Pakistan Sign Defense Pact"
 endtimes.23.d: "WNN reports that Saudi Arabia, Turkey and Pakistan have signed a mutual defense pact, pledging to guarantee one another's independence and refrain from aggression against each other.\n\nThe three governments describe the agreement as a response to the conflict with Iran and the Houthis in Yemen. By coordinating their security commitments, they hope to deter further attacks and strengthen their position in the region.\n\nAlthough presented as a defensive arrangement, the pact could also be seen as hostile to Israel, adding another source of tension to an already volatile Middle East."
 endtimes.23.a: "A new security pact in the region."

 endtimes.24.t: "Israel Drops Nuclear Bomb on Iran"
 endtimes.24.d: "WNN reports that Israel has dropped a nuclear bomb on Tehran, Iran's capital, in retaliation for the dirty bomb attack outside Jerusalem. The strike marks a dramatic escalation of the crisis in the Middle East.\n\nThe world is on edge as governments watch for Iran's response. Will Tehran retaliate, will other powers be drawn into the conflict, or can diplomacy prevent further escalation?\n\nWith the possibility of more nuclear strikes now looming over the region, the coming days could determine whether this catastrophe remains a single attack or becomes the opening of a wider war."
 endtimes.24.a: "The world holds its breath."

 endtimes.25.t: "Alex Makes Alliance Official"
 endtimes.25.d: "An alliance of One Faith nations has officially come together with Alex as their leader to unite the interests of the new Church and State and benefit from full Economic and Strategic military cooperation.  The first group unites the former Islamic world but many other countries are showing interest, especially for the economic benefits."
 endtimes.25.a: "One Faith, One World"

 endtimes.26.t: "Iran Joins the MeccaPact"
 endtimes.26.d: "Iran has long been an enemy of many MeccaPact countries, but now sees an opportunity for unity with the rest of the region. With China having just joined the new order, Iran has decided to join as well.\n\nThe Axis of Resistance is dissolved. Iraq, Free Syria and Hezbollah are freed from Iranian rule if they remain Iranian subjects, and join Iran in the MeccaPact as independent members wherever they still exist and are free to join."
 endtimes.26.a: "The Middle East united."
 endtimes.28.t: "A Coup in Israel"
 endtimes.28.d: "WNN reports that a coup has brought a new government to power in Israel. Days after the Vatican was stormed, with Israel beset on every side by the One Faith, One World Alliance, a group of wealthy Israeli businessmen announced that a deal had been reached with the Alliance.\n\nThe agreement sets out a framework for peaceful coexistence through a two-state system and the rebuilding of Gaza. Eitan Ben-Ami has been installed as the new president, and Jerusalem is to become an open Holy City once again for all believers.\n\nIsrael joins the alliance formerly known as the CSTO, and its new leadership enters the Cabal. The existing Palestinian and Gaza governments are brought into the same alliance and network as part of the settlement."
 endtimes.28.a: "The new president accepts the settlement."
 endtimes.29.a: "A new order takes hold in the Holy Land."

 endtimes.30.t: "The Moment of Desolation"
 endtimes.30.d: "The Pope was assassinated and the apostasy has spread worldwide. Most of the world now stands in alliance with the Biblical Beast of Revelation.\n\nAcross the Americas and Europe, civil war threatens to break out. Governments fracture, loyalties divide, and the remaining opposition faces a world increasingly united under Alex's authority.\n\nChina is now preparing to formally join Alex's alliance. As the One Faith, One World order extends its reach, the world stands at the moment of desolation."
 endtimes.30.a: "The world stands on the brink."

 endtimes.31.t: "China Joins the One Faith, One World Alliance"
 endtimes.31.d: "China has maintained close links and cooperation with Alex's Cabal for many years. Now, with the old world gone and trade with the West at an end, Beijing has announced that it is casting aside its remaining restraints and formally joining the One Faith, One World Alliance, formerly known as the CSTO.\n\nChina is fully implementing the SOLOMON world banking system and currency. Participation brings an 80 percent debt write-off at adoption and a permanent 4 percent bonus to weekly revenue, binding its economic future to Alex's new order.\n\nFollowing its entry into the alliance, China has declared war on the Philippines, Taiwan and Japan. Beijing's alignment with Alex is now matched by a military offensive across East Asia."
 endtimes.31.a: "China commits to the new order."
 endtimes.32.a: "War spreads across East Asia."

 endtimes.33.t: "The Asian Quad Joins NATO"
 endtimes.33.d: "The Asian Quad needs to become a full part of NATO to align against the MeccaPact. With lines drawn and all the evil in the world, war could break out at any time.\n\nJapan dissolves its alliance as Australia, India, Japan, South Korea, the Philippines and New Zealand join NATO."
 endtimes.33.a: "Together, we stand with NATO."

 endtimes.35.t: "Israel Strikes Iran with a Nuclear Weapon"
 endtimes.35.d: "WNN reports that Israel has detonated a nuclear weapon in Khuzestan as Iranian forces and their allies press the war against Israel.\n\nThe Israeli government has warned that it will continue using nuclear weapons until Iran and its allies withdraw and end their offensive. Tehran, it declares, will be next.\n\nThe threat of further nuclear strikes now hangs over the region as the world waits for Iran's response."
 endtimes.35.a: "Tehran has been warned."
 endtimes.36.t: "A Ceasefire After the Nuclear Strike"
 endtimes.36.d: "One day after the nuclear explosion in Khuzestan, Iran and its dependent governments have agreed to a white peace with Israel and Jordan.\n\nThe fighting ends without a peace-conference settlement. Iran's existing puppets remain under its control for now."
 endtimes.36.a: "The offensive ends."
 endtimes.37.t: "Israel Nukes Iran"
 endtimes.37.d: "Iran took a calculated risk: either Israel would not actually use a nuclear weapon, or Tehran was prepared to absorb a single strike. The explosion in Khuzestan has exposed the consequences of that gamble.\n\nIran apparently does not yet have a nuclear weapon of its own; otherwise, it would probably have announced it by now. Israel's warning that Tehran would be next has been followed by a ceasefire.\n\nIran and its dependent governments have made white peace with Israel and Jordan. Iran's chain of puppets remains intact for now."
 endtimes.37.a: "A nuclear warning brings a fragile peace."

 endtimeseal.1.t: "The First Seal"
 endtimeseal.1.d: "I looked, and there was a white horse, and its rider had a bow. He was given a crown, and he rode forth victorious to further his victories.\n\nThe world order is crumbling and all the pent up potential conflicts are getting ready to burst."
 endtimeseal.1.a: "Soon war won't be so far away"

 endtimeseal.2.t: "The Second Seal"
 endtimeseal.2.d: "Another horse came out, a red one. Its rider was given power to take peace away from the earth, so that people would slaughter one another. And he was given a huge sword.\n\nAll Hell has broken loose, all the simmering conflicts are now full blown."
 endtimeseal.2.a: "The world has gone crazy"

 endtimeseal.3.t: "The Third Seal"
 endtimeseal.3.d: "I looked, and there was a black horse, and its rider held a scale in his hand. “A ration of wheat costs a day’s pay, and three rations of barley cost a day’s pay. But do not damage the olive oil or the wine.\n\nEven if bombs aren't falling near you, fuel and food are getting scarce or very expensive.  Global markets are disrupted everywhere."
 endtimeseal.3.a: "Trade has broken down on top of local crop failures"

 endtimeseal.4.t: "The Fourth Seal"
 endtimeseal.4.d: "I looked, and there was a pale green horse. Its rider was named Death, and Hades accompanied him. They were given authority over a quarter of the earth, to kill with sword, famine, and plague, and by means of the beasts of the earth.\n\nThe current population of the world is only possible with peace and trade, when chaos is everywhere, areas without local food supply are cut off.  That and all the disease we once conquered are showing up again without services to stop them."
 endtimeseal.4.a: "On our way to 2 Billion Dead"

 endtimeseal.5.t: "The Fifth Seal"
 endtimeseal.5.d: "“How long will it be, holy and true master, before you sit in judgment and avenge our blood on the inhabitants of the earth?”\n\nOn top of the War, Famine, Disease and Natural Disasters, add religious persecution, as the One Faith actively persecutes anyone who opposes it."
 endtimeseal.5.a: "Is anywhere safe, when will this end?"
 endtimes.38.t: "Global Ceasefire"
 endtimes.38.d: "After the Miracle, the world remains shaken by the Warning and the revelation of each person's sins and the state of their soul. The Miracle has renewed that conviction. Soldiers are refusing to fight, and generals are afraid to order attacks.\n\nAlex who gained some notice by predicting the Miracle, says it's part of his mission to bring peace to the world. The major conflicts, if not already resolved, come to a halt in white peace. Fighting between the United States and Canada, California, and their WestNATO allies, between Iran and Israel, and between China and the Philippines, Japan, Taiwan, and South Korea falls silent, wherever those wars are still active."
 endtimes.38.a: "God wouldn't want us fighting"

 endtimes_russia_ceasefire_no_report: ""
 endtimes_russia_ceasefire_report: "\n\nRussia has agreed to a change of government that will no longer be an adversary to the West. Dmitri Leonidovich Orlov heads a pro-Western transitional government, with elections scheduled for October 9, 2028. Poland, Germany, Finland, and Alex personally will have a say in all government post appointments and state affairs during the transition. Russia remains in the Cabal.\n\nEstonia, Latvia, and Lithuania regain their freedom. Kaliningrad is transferred to Lithuania and integrated as a core part of the country. Belarus is released from puppet status, and Ukraine regains its full borders, including Crimea. The CSTO is disbanded.[GetEndtimesFarEastCeasefireReport]"
 endtimes_russia_far_east_ceasefire_report: " The Chinese-controlled Far East is returned to Russia."

 endtimes.39.t: "Russia at a Crossroads"
 endtimes.39.d: "[GetEndtimesRussiaOctoberChoiceDescription]"
 endtimes.39.d_interim: "The elections promised by the Western-backed transitional government are approaching. Since the Russian Orthodox Church joined with Rome and the Pope visited, many Russians have turned toward the West. Yet the One Faith remains popular, and supporters of autocratic rule demand that the interim president stay in power.\n\nWe can suspend elections, retain the current president and join the MeccaPact. This brings Western Christianity, the SOLOMON currency system and a write-off of half our debt, but ends the democratic transition and empties our remaining manpower reserves. Alternatively, we can hold elections, replace the interim president with a new pro-Western president and bring stability to 80%."
 endtimes.39.d_no_interim: "Russia faces a choice between autocratic order and a democratic opening. The One Faith has gained many followers, while the upheaval abroad has strengthened calls for closer ties with the West.\n\nWe can suspend elections, retain the current president and join the MeccaPact. This brings Western Christianity, the SOLOMON currency system and a write-off of half our debt, but empties our remaining manpower reserves. Alternatively, we can hold elections, replace the current president with a new pro-Western president and bring stability to 80%."
 endtimes.39.a: "Suspend elections and join the MeccaPact."
 endtimes.39.b: "Hold elections and elect a new pro-Western president."
 endtimes.43.t: "Russia Chooses Elections"
 endtimes.43.d: "Russia has rejected calls to suspend elections and join the MeccaPact. Voters have chosen a new pro-Western president, [SOV.GetLeader], replacing the previous head of government.\n\nThe new administration has pledged to preserve democratic elections and pursue closer relations with the West. Stability has reached 80% as Russia begins a new political chapter."
 endtimes.43.a: "A new mandate for Russia."
 endtimes.40.t: "More Trouble in Russia"
 endtimes.40.d: "[GetEndtimesRussiaOctoberCoupDescription]"
 endtimes.40.a: "Russia turns toward the new order."

 endtimes.41.t: "Christmas Consecration"
 endtimes.41.d: "Life is not normal. Major disasters are happening, and non-Christians and followers of Alex are becoming very militant. Some areas are overrun. It is not quite a civil war, but there are disruptions in the fabric of society.\n\nWe have decided that we must go back to the dollar and remove all ties to the One Faith and the SOLOMON payment system. The western states do not agree and are looking to split off again.\n\nCalifornia becomes independent, retaining the SOLOMON system and joining the Cabal, while the United States rejects Alex's systems and receives its Christmas consecration."
 endtimes.41.a: "Consecrate the nation. Return to the dollar."
 endtimes_usa_defensive_mission_tt: "§RThe restored United States has renounced aggression and cannot justify new wars.§!"

 endtimes_usa_beast_systems_banned_tt: "The United States has not abolished the Beast financial systems."

 endtimes_nato_reunification_no_report: ""
 endtimes_nato_reunification_report: "\n\nThe temporary WestNATO split has ended. Its surviving members have returned to NATO, restoring a single alliance as the Great Peace takes effect."

 endtimes.40.d_interim: "Russia was supposed to hold an election this month. Since the Russian Orthodox Church joined with Rome and the Pope visited, the people have begun leaning in a pro-Western direction. Yet the One Faith is also very popular, and many are naturally drawn to autocrats.\n\nThe world is a mess, and Germany in particular has too many problems at home to maintain close oversight. In a coup, Russia's elections have been suspended. The interim leader will remain in power, now heading a nationalist autocracy.\n\nRussia adopts Western Christianity as its official religious alignment and joins the MeccaPact. A SOLOMON currency agreement writes off half of its current debt and brings the benefits of the global banking system. The promised democratic transition has come to an end."
 endtimes.40.d_no_interim: "Even without the Western-backed interim government, Russia has not escaped the upheaval spreading across the world. The One Faith is very popular, and many Russians are drawn to the promise of autocratic order.\n\nWith the world in chaos and Germany occupied by problems at home, a coup has swept aside the remaining restraints on power. The current leader remains in charge, now heading a nationalist autocracy. Elections are suspended indefinitely.\n\nRussia adopts Western Christianity as its official religious alignment and joins the MeccaPact. It receives the SOLOMON currency system and a write-off of half its current debt, while the armed forces report that no further manpower reserves are available. The Kremlin has committed itself to the new global order."
