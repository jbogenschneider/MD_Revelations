l_english:
 endtimes.15.t: "Alex's Puppet Takes Over"
 endtimes.15.d: "Vladimir Putin and Russia were in Alex's Cabal, but Putin entirely pursed his own Imperial Ambitions. Alex knew Russia would fail but create a power vacume that his people would quickly fill.  Now Alex has total control of Russia, with the full support of the oligarchy.\n\nHe brings a vast personal fortune, a complete artificial intelligence system, and a new currency. Russia is starting over, free of international debt and ready to put its oil revenues to work rebuilding the country. Through Alex's global business ties, especially in the Middle East, Russia will soon be back in business.  Alex still uses another Russian Oligarch as the actual figurehead in public."
 endtimes.15.a: "Russia begins again under Alex."

 endtimes.1.t: "For Your Eyes Only"
 endtimes.1.d: "On October 2, 2024, your leader personally entered into an agreement with the leader of an international shadow organization. The cabal of a very select group of very powerful, wealthy and deologically aligned leaders.  The cabal promotes common economic interests, especially personal ones, through backchannel banking and investments. Secrecy is of the utmost importance.\n\nThe agreement promises benefits to all parties: subverting democracies, propaganda, populism, sharing technology, securing infrastructure and energy deals, as well as, advancing artificial intelligence, particularly for military applications. Members are expected to help advance these shared objectives.\n\nKnowledge of the organization and any links to it must be kept to an absolute minimum. Alongside heads of state, its membership includes influential and fabulously rich oligarchs whose wealth, connections, military contacts and influence are essential to achieving these objectives."
 endtimes.1.a: "Keep this strictly confidential."
 endtimes.2.t: "The Price of Victory"
 endtimes.2.d: "For the leader of the United States, the timing of October 2, 2024, was no coincidence. With the 2024 presidential election only a few weeks away, the leader of the organization approached candidate Donald Trump. The organization deliberately has no name, but the game will call it the Cabal.\n\nThe offer was a guaranteed electoral victory in the 2024 election, secured with the help of all the other members. In exchange, Trump would commit to full participation in the organization's objectives, including supporting the interests of its members as much as possible.\n\nHe would also need to swear a measure of fealty to its leader. Trump was assured that their interests were already very closely aligned."
 endtimes.2.a: "The understanding remains confidential."

 endtimes_cabal: "Cabal"
 endtimes_cabal_desc: "An inner circle of heads of state and influential oligarchs shares technology, capital, and influence through secret agreements. Electronics research speed is increased by 5%. Stability and war support are maintained at a minimum of 30% while membership lasts."
 endtimes_cabal_support_floor: "Dictators, Oligarchs, Equity Funds, the biggest players are all 2 degrees of each other, and united in greed"

 endtimes.3.t: "The Great Warning"
 endtimes.3.d: "An event foretold by many sources much more clearly then in Revelation, but likely part of the 6th Seal in Revelation. Every person on Earth has seen the state of their soul, their sins and will know Jesus is God.  It's an Illumination of Concious.\n\nRev 6:14-16 Then the sky was divided like a torn scroll curling up...Fall on us and hide us from the face of the one who sits on the throne. 11:19 Then God’s temple in heaven was opened, and the ark of his covenant[relative to your soul] could be seen in the temple"
 endtimes.3.a: "The mini-Judgement, before being sealed...or the mark"
 endtimes.4.t: "The Miracle"
 endtimes.4.d: "A permanent miracle has appeared at numerous locations around the Earth where Marian Apparitians have previously occured like Garabandal, Guadelupe, Heede, Medjegorje and Lordes.  It can be described as suspended Cross that can be seen and photographed, but strangely cannot be touched. It is not a projection.\n\nSick people who were present at these locations at the time of the Miracle claim to have been cured.\n\nChurches are strained with so many returning people."
 endtimes.4.a: "We have witnessed the Miracle."

 endtimes.19.t: "The Eastern Orthodox Rejoin"
 endtimes.19.d: "In the days following the Miracle, a historic reunion has begun. The Eastern churches, separated from the Roman Catholics for roughly a millennium and divided largely along national lines, are looking once more to the Pope as leader of the flock.\n\nTheir ancient liturgies, local traditions, and everyday parish life continue much as before. Yet the political meaning is profound: Greece, Romania, and Ukraine now feel far more united with northern and western Europe, sharing a renewed sense of Christian fellowship and common purpose.\n\nRussia's Orthodox Church has not yet committed to the union. Looks like Easter will be a common date this year."
 endtimes.19.a: "A divided flock begins to reunite."

 endtimes.5.t: "A New Church Begins to Emerge"
 endtimes.5.d: "The story of Alex and the Prophet as he's now referred to is spreading rapidly online and in media.  With the Warning and Miracle, everyone on earth is aware of the supernatural, although there are some claims of aliens, most people believe its from God.  The One Faith as it's now called by Alex's followers, recruits clerics of other faiths like Islam, Hinduism and Buddahism and aligns it with the Christian God.  Western Churches are opposed to this message but there are many converts in the west as well especially among previously non-religious."
 endtimes.5.a: "The One Faith Movement"

 endtimes.6.t: "Alex rises from the Dead"
 endtimes.6.d: "Three days ago an assassin attacked a wealthy businessman.\n\nThe attacker, a Catholic zealot, stabbed Alex with a dagger. Alex, is known by another name, but from now on will be known simply as Alex.  He was pronounced dead from his wounds, but today he later emerged from the morgue, fully healed, and said he was given a special purpose by God to unite the faith.  At least one priest, is claiming to have also received messages from God regarding Alex's mission and is able to perform signs as well."
 endtimes.6.a: "A new faith is born in the Holy Land"

 endtimes.16.t: "[ROOT.GetName] Joins Alex's Alliance"
 endtimes.16.d: "[ROOT.GetName] has committed itself to Alex's new order. Previous alliance commitments are cast aside as our country joins the alliance formerly known as the CSTO.\n\nMorocco, Algeria, Egypt, Libya, Tunisia, Jordan, Saudi Arabia, Oman, Yemen, Pakistan, Bangladesh, Bahrain, Qatar, Iraq, Kuwait, Free Syria, Indonesia, Brunei, Turkmenistan, Azerbaijan, Uzbekistan, Tajikistan, Kyrgyzstan and the United Arab Emirates stand together in this realignment. Their leaders enter the Cabal, binding their fortunes to Alex and his network of allied governments and business interests.\n\nWars against any other countries are ended in white peace."
 endtimes.16.a: "Our future lies with Alex."

 endtimes.20.t: "The One Faith Spreads"
 endtimes.20.d: "The One Faith has spread worldwide especially with the help of social media and because Alex and the Prophet broadcast a short service online each week reaching hundreds of millions of viewers.  Catholic and Christian voices, however are concerned, the message is in full contrast to the teachings of Jesus and Jesus is completely absent.  They also warn that this is the deception prophesized in Revelation and for centuries by the Church."
 endtimes.20.a: "The Apostasy is becoming clear"

 endtimes.7.t: "A hit job on the Papacy"
 endtimes.7.d: "Christian churches are calling the One Faith a heresy and the Vatican was getting ready to make a formal decree stating their teachings to be very inconsistent with Christianity and that Christians should not add the Prophet's message to it.  On Halloween night a large group of Pro-One Faith protesters, 1000s, most in costumes flash mobbed the Vatican.  It was cover for a large group of [Russian fulfills a prophecy] commandos and other One Faith operatives stormed the Vatican.\n\nIt wasn't clear if the intention was to kill the Pope or not but Pope Leo XVI and many other clergy are dead. Saint Peters was partially burned and the Vatican security like the Swiss Guard were almost killed to the last man.  Many questions regarding how Italy security forces could have allow essentially an enemy army into Rome are currently left unanswered."
 endtimes.7.a: "The Holy Father has been Martyred"

 endtimes.8.t: "A Dirty Bomb Outside Jerusalem"
 endtimes.8.d: "A dirty bomb has exploded just outside Jerusalem. Iran is suspected, and Israel has vowed retribution."
 endtimes.8.a: "The world awaits Israel's response."
 endtimes.9.t: "Tehran Suffers a Nuclear Strike"
 endtimes.9.d: "Israel has carried out a nuclear strike on Tehran in retaliation for the dirty bomb attack outside Jerusalem. The Iranian capital has suffered the destructive effects of an atomic explosion."
 endtimes.9.a: "A catastrophe for Tehran."

 endtimes.10.t: "Europe Realigns"
 endtimes.10.d: "The forcible replacement and exile of the real Pope have exposed the reality of the One World Religion: it is not merely religious, but political. With most of the world clearly aligned with the leader of the Cabal, Western politicians have awakened to the fact that Alex, as he wishes to be called, is indeed the Antichrist and must be resisted.\n\nA leader has emerged in France: the rightful heir to the throne. What remains of NATO will begin to unite under a single banner for the True Christ, if only to try to survive this tribulation.\n\nProphecy speaks of an Era of Peace once Alex's reign ends."
 endtimes.10.a: "Europe prepares to resist."

 endtimes.11.t: "A New King for France"
 endtimes.11.d: "Five days after the outbreak of civil war, a predominantly Christian movement backed by loyal elements of the French Army has ousted Marine Le Pen and the National Front. Those loyal to Alex are driven from power as the surviving French government turns to a monarchy.\n\nTheir leader is General Geoffroy Saint-Michel of the French Army. In the presence of his loyal subordinates and many refugees, Saint Michael appeared to him and delivered this message:\n\n'The time for all to unite in Jesus' name is now. Geoffroy is chosen by Jesus as your monarch, and his son Henri as the heir, to see you through a little while longer. Geoffroy, he has been prepared his whole life for this vocation."
 endtimes.11.a: "France welcomes its new king."

 endtimes.14.t: "A Royal Chancellor for Germany"
 endtimes.14.d: "Germany has embraced the royal settlement proclaimed by King Geoffroy Saint-Michel of France. By the French monarch's appointment, General Matthias von Falkenberg takes office as Chancellor, entrusted with governing Germany under the new monarchy.\n\nGermany retains its sovereignty, its armed forces, and leadership of NATO. France and Germany stand together as full allies in the struggle against the Beast. The Chancellor's royal appointment does not make Germany a French subject.\n\nThe settlement also redraws Central Europe's borders. Austria is incorporated into Germany, while Mecklenburg-Vorpommern, Brandenburg, Berlin, Saxony-Anhalt, Saxony, and Thuringia form an independent East Germany, with its capital in Berlin. The new state inherits Germany's current technology and recreates the military formations historically based in its territory. Germany's government moves to Bonn."
 endtimes.14.a: "The Chancellor takes his oath."

 endtimes.17.t: "[ROOT.GetName] Joins the Royal Settlement"
 endtimes.17.d: "Following the restoration of the French monarchy under King Geoffroy Saint-Michel, Spain and Portugal have agreed to join the royal settlement.\n\nOur government adopts monarchist rule while retaining its present national leader, who will continue to govern under the new political order. Elections are abolished as the country commits itself to the monarchy.\n\nSpain and Portugal confirm their place in NATO, returning to the alliance if necessary."
 endtimes.17.a: "We join the royal settlement."

 endtimes.18.t: "[ROOT.GetName] Joins the Royal Settlement"
 endtimes.18.d: "Ten days after the restoration of the French monarchy under King Geoffroy Saint-Michel, the United Kingdom and Ireland have agreed to join the royal settlement.\n\nOur government adopts monarchist rule while retaining its present national leader. Elections are abolished under the new political order.\n\nIreland joins NATO, and the United Kingdom confirms its place in the alliance, returning if necessary. Together with France, Germany, Spain, and Portugal, they stand within the same alliance."
 endtimes.18.a: "We join the royal settlement and NATO."

 endtimes.12.t: "Prophecy Fulfilled"
 endtimes.12.d: "There is no denying it any longer: the Book of Revelation is now unfolding in real time. Rome and Israel are under the control of the Beast, the religion of his False Prophet has spread throughout the world, and Christians are threatened everywhere.\n\nChristians must flee and gather together for safety, to endure the next few years until the biblical Millennium, or Era of Peace, that awaits those who hold firm to Jesus Christ and survive.\n\n§YMark 13:14§!\n\"When you see ‘the abomination that causes desolation’ standing where it does not belong—let the reader understand—then let those who are in Judea flee to the mountains.\"\n\n§YDaniel 9:27 — The prophecy Jesus references§!\n\"He will confirm a covenant with many for one ‘seven.’ In the middle of the ‘seven’ he will put an end to sacrifice and offering. And at the temple he will set up an abomination that causes desolation, until the end that is decreed is poured out on him.\"\n\n§YRevelation 12:6 — The escape from the dragon/beast§!\n\"The woman fled into the wilderness to a place prepared for her by God, where she might be taken care of for 1,260 days.\"\n\n§YRevelation 20:2–3§!\n\"He seized the dragon, that ancient serpent, who is the devil, or Satan, and bound him for a thousand years. He threw him into the Abyss, and locked and sealed it over him, to keep him from deceiving the nations anymore until the thousand years were ended. After that, he must be set free for a short time.\""
 endtimes.12.a: "Hold firm to Jesus Christ."

 endtimes.13.t: "A Bad Harvest"
 endtimes.13.d: "The super El Niño of 2026 brought lower harvests across Asia and Africa, compounded by the failure to export Black Sea grain because of war.\n\nIn 2027, unfavorable conditions also struck the Western world, ushering in famine in parts of Africa and Southeast Asia.\n\nThese droughts, combined with earthquakes and the need for constant relief efforts, are placing an especially heavy strain on the developing world. More countries are struggling to survive as functioning states."
 endtimes.13.a: "The world faces a growing crisis."

 endtimes.21.t: "Famine and Other Disasters"
 endtimes.21.d: "Starting with the super El Niño of 2026 and continuing through 2027, 2028, and now 2029, the world has endured a nonstop series of droughts, floods, earthquakes, and other disasters, now compounded by the Great Reset.\n\nFamine and plague are running rampant through the developing world. These are not new diseases, but old and existing ones that have spiraled out of control. HIV, for example, is widespread across Africa, Russia, and Southeast Asia.\n\nOver a billion fewer people are alive today than in 2027, and the crisis is out of control in many areas.\n\nCountries suffering from famine and disease now have a national spirit reflecting their plight."
 endtimes.21.a: "The suffering continues."

 endtimes.22.t: "Civil War in France"
 endtimes.22.d: "After the incident at the Vatican, Marine Le Pen's government revealed that it was allied with Alex and intended to bring France into the SOLOMON system.\n\nThe socialist far left was the first to revolt. Its opposition was not driven by concern for the Vatican, but because that system was incompatible with its politics."
 endtimes.22.a: "France descends into civil war."

 endtimes_famine_and_disease: "Famine and Disease"
 endtimes_famine_and_disease_desc: "Repeated harvest failures, disease outbreaks, and collapsing relief networks have left the population struggling for survival. Essential civilian needs consume the country's productive capacity."
 endtimes_famine_consumption_floor: "Famine and Disease"
 endtimes_famine_consumption_floor_tt: "Consumer-goods demand is maintained at a minimum of §R90%§!, recalculated daily. Any higher demand is preserved."

 endtimes.23.t: "Saudi Arabia, Turkey and Pakistan Sign Defense Pact"
 endtimes.23.d: "WNN reports that Saudi Arabia, Turkey and Pakistan have signed a mutual defense pact, pledging to guarantee one another's independence and refrain from aggression against each other.\n\nThe three governments describe the agreement as a response to the conflict with Iran and the Houthis in Yemen. By coordinating their security commitments, they hope to deter further attacks and strengthen their position in the region.\n\nAlthough presented as a defensive arrangement, the pact could also be seen as hostile to Israel, adding another source of tension to an already volatile Middle East."
 endtimes.23.a: "A new security pact in the region."

 endtimes.24.t: "Israel Drops Nuclear Bomb on Iran"
 endtimes.24.d: "WNN reports that Israel has dropped a nuclear bomb on Tehran, Iran's capital, in retaliation for the dirty bomb attack outside Jerusalem. The strike marks a dramatic escalation of the crisis in the Middle East.\n\nThe world is on edge as governments watch for Iran's response. Will Tehran retaliate, will other powers be drawn into the conflict, or can diplomacy prevent further escalation?\n\nWith the possibility of more nuclear strikes now looming over the region, the coming days could determine whether this catastrophe remains a single attack or becomes the opening of a wider war."
 endtimes.24.a: "The world holds its breath."

 endtimes.25.t: "Alex Make Alliance Official"
 endtimes.25.d: "An alliance of One Faith nations has officially come together with Alex as their leader to unite the interests of the new Church and State and benefit from full Economic and Strategic military cooperation.  The first group unites the former Islamic world but many other countries are showing interest, especially for the economic benefits."
 endtimes.25.a: "One Faith, One World"

 endtimes.26.t: "Iran Joins the One Faith, One World Alliance"
 endtimes.26.d: "Iran recently devastated by the nuclear strike on Tehran, is a bairly functioning state.  The One Faith and Christianty have spread since the Warning also affect that country and so the old regime has mostly been replaced by the military, a military very willing to give it's services to Alex."
 endtimes.26.a: "The middle east united"
 endtimes.28.t: "A Coup in Israel"
 endtimes.28.d: "WNN reports that a coup has brought a new government to power in Israel. Days after the Vatican was stormed, with Israel beset on every side by the One Faith, One World Alliance, a group of wealthy Israeli businessmen announced that a deal had been reached with the Alliance.\n\nThe agreement sets out a framework for peaceful coexistence through a two-state system and the rebuilding of Gaza. Eitan Ben-Ami has been installed as the new president, and Jerusalem is to become an open Holy City once again for all believers.\n\nIsrael joins the alliance formerly known as the CSTO, and its new leadership enters the Cabal. The existing Palestinian and Gaza governments are brought into the same alliance and network as part of the settlement."
 endtimes.28.a: "The new president accepts the settlement."
 endtimes.29.a: "A new order takes hold in the Holy Land."

 endtimes.30.t: "The Moment of Desolation"
 endtimes.30.d: "The Seat of Saint Peter is empty, and apostasy has spread worldwide. Jerusalem has bent its knee to Alex, and most of the world now stands in alliance with the Biblical Beast of Revelation.\n\nAcross North America and Europe, civil war has already erupted or threatens to break out. Governments fracture, loyalties divide, and the remaining opposition faces a world increasingly united under Alex's authority.\n\nChina is now preparing to formally join Alex's alliance. As the One Faith, One World order extends its reach, the world stands at the moment of desolation."
 endtimes.30.a: "The world stands on the brink."

 endtimes.31.t: "China Joins the One Faith, One World Alliance"
 endtimes.31.d: "China has maintained close links and cooperation with Alex's Cabal for many years. Now, with the old world gone and trade with the West at an end, Beijing has announced that it is casting aside its remaining restraints and formally joining the One Faith, One World Alliance, formerly known as the CSTO.\n\nChina will fully implement the SOLOMON world banking system and currency. Under the agreement, 90 percent of China's outstanding debt is written off, binding its economic future to Alex's new order.\n\nFollowing its entry into the alliance, China has declared war on the Philippines, Taiwan and Japan. Beijing's alignment with Alex is now matched by a military offensive across East Asia."
 endtimes.31.a: "China commits to the new order."
 endtimes.32.a: "War spreads across East Asia."

 endtimes.33.t: "Australia Must Pick a Side"
 endtimes.33.d: "The world is ending. We need to pick a side.\n\nWith the international order collapsing and war spreading across the Pacific, Australia can no longer stand aside. If NATO and the United States are at war, we can join NATO and enter its war against the USA. Alternatively, we can fight China and the alliance formerly known as the CSTO.\n\nIf NATO and the USA are not at war, Australia will fight China and the CSTO. Whichever course we take, the country will rally for war."
 endtimes.33.a: "Join NATO and its war against the USA."
 endtimes.33.b: "Fight China and the CSTO."

 endtimes.35.t: "Israel Strikes Iran with a Nuclear Weapon"
 endtimes.35.d: "WNN reports that Israel has detonated a nuclear weapon in Khuzestan as Iranian forces and their allies press the war against Israel.\n\nThe Israeli government has warned that it will continue using nuclear weapons until Iran and its allies withdraw and end their offensive. Tehran, it declares, will be next.\n\nThe threat of further nuclear strikes now hangs over the region as the world waits for Iran's response."
 endtimes.35.a: "Tehran has been warned."
 endtimes.36.t: "A Ceasefire After the Nuclear Strike"
 endtimes.36.d: "One day after the nuclear explosion in Khuzestan, Iran and its dependent governments have agreed to a white peace with Israel and Jordan.\n\nThe fighting ends without a peace-conference settlement. Iran's existing puppets remain under its control for now."
 endtimes.36.a: "The offensive ends."
 endtimes.37.t: "Israel Nukes Iran"
 endtimes.37.d: "Iran took a calculated risk: either Israel would not actually use a nuclear weapon, or Tehran was prepared to absorb a single strike. The explosion in Khuzestan has exposed the consequences of that gamble.\n\nIran apparently does not yet have a nuclear weapon of its own; otherwise, it would probably have announced it by now. Israel's warning that Tehran would be next has been followed by a ceasefire.\n\nIran and its dependent governments have made white peace with Israel and Jordan. Iran's chain of puppets remains intact for now."
 endtimes.37.a: "A nuclear warning brings a fragile peace."
