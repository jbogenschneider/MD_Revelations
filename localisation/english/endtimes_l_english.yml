l_english:
 endtimes.15.t: "Alex's Puppet Takes Over"
 endtimes.15.d: "Vladimir Putin and Russia were in Alex's Cabal, but Putin entirely pursed his own Imperial Ambitions. Alex knew Russia would fail but create a power vacume that his people would quickly fill.  Now Alex has total control of Russia, with the full support of the oligarchy.\n\nHe brings a vast personal fortune, a complete artificial intelligence system, and a new currency. Russia is starting over, free of international debt and ready to put its oil revenues to work rebuilding the country. Through Alex's global business ties, especially in the Middle East, Russia will soon be back in business.  Alex still uses another Russian Oligarch as the actual figurehead in public."
 endtimes.15.a: "Russia begins again under Alex."

 endtimes.70.t: "The Two Witnesses"
 endtimes.70.d: "Just as Alex and his prophets have been performing signs and wonders, two old men have appeared in Jerusalem. They seem able to one-up Alex's prophets with wonders and miracles of their own, and they are preaching the truth of Jesus Christ.\n\nSo far, the local authorities have allowed them to preach, but Alex cannot be happy about it."
 endtimes.70.a: "Jerusalem is listening."

 endtimeseal.7.t: "The Sealed"
 endtimeseal.7.d: "Just as the Beast, Alex, has the Mark, those loyal to Jesus also receive their seal. Angels will protect them and give them extraordinary courage to protect My People and provide refuge. Those who perish will be martyrs.\n\nWe will take the battle to those who would harm us and shelter all who seek our protection."
 endtimeseal.7.a: "Protect My People. Shelter those in need."
 endtimeseal.6.t: "The Mark"
 endtimeseal.6.d: "The Mark is not exactly the One World banking system, SOLOMON, itself. Although there are biometric ways to use that system, which Alex's Cabal uses to track people, the real Mark is a mystical tattoo taken near the right temple. It seems to have physical benefits: some say it relieves their pain, gives them extra strength and makes them more intelligent.\n\nOne thing is certain: it makes the Alexians who take it more violent and aggressive in their persecution of Christians. So far, it is mostly limited to areas within the AlexPact, but his priests are spreading it in Europe and the Americas too.\n\nOn the bright side, one reported side effect is that it fills the wearer with anxiety and heightened self-preservation instincts—traits common in thugs, but not soldiers."
 endtimeseal.6.a: "The Mark is spreading."
 endtimes_angelic_protection: "Angelic Protection"
 endtimes_angelic_protection_desc: "Angelic protection sustains the nation and its defenders. Population growth replenishes future manpower, while soldiers stand firm and recover their organization more quickly."
 endtimes_mark: "The Mark"
 endtimes_mark_desc: "Alex's mystical Mark fuels aggression and persecution, but its wearers' anxiety and heightened instinct for self-preservation undermine military recruitment, organization and recovery."
 endtimes.47.t: "Alex Launches Global War"
 endtimes.47.d: "Alex is not much of a general, but he has aligned a huge force. His priorities are India and Southern Europe for now."
 endtimes.47.a: "The global war has begun."
 endtimes.46.t: "Join or War"
 endtimes.46.d: "The EU has disbanded and civil wars have already started, but the real World War III has not commenced yet. That changes now, as Alex has issued ultimatums around the world: join, or it will be war.\n\nAreas such as Latin America and Africa are mostly immune to these threats, at least for now. For Europe and Asia, however, the threats are real. India and South Korea are very vulnerable, and Southern Europe is a major target for the AlexPact.\n\nEast Germany, Slovakia, Czechia, Hungary, Serbia, Bulgaria, Albania, Kosovo, Azerbaijan, Armenia, Georgia, Morocco, Tunisia and Austria are among the countries targeted by the ultimatum. Those that accept leave their previous alliances, including NATO where applicable. Slovakia, Czechia, Hungary, Serbia, Albania and Kosovo adopt the Emerging outlook. Bulgaria, Azerbaijan, Armenia, Georgia, Morocco, Tunisia and Austria also adopt the Emerging outlook, with democratic elections enabled. Kuwait, Bahrain, Qatar, and Libya are offered Saudi overlordship under their current leaders. Countries that accept join the MeccaPact, adopt SOLOMON, enter the Cabal and receive the Mark."
 endtimes.46.a: "The lines are drawn."
 endtimes.71.d: "Alex has issued an ultimatum to [ROOT.GetNameDef]. Our government can accept his terms or stay out of the realignment."
 endtimes.71.a: "Accept the ultimatum."
 endtimes.71.b: "Decline and stay out of the realignment."
 endtimes.45.t: "EU Disolves"
 endtimes.45.d: "The EU zone has been hammered over the past year. The USA, China and the Middle East devastated European banks by writing off their debts, while wars shattered energy security and trade. Religious unrest and natural disasters have made the situation catastrophic.\n\nThe last straw is that many nations seeking stability now want to join the One World currency, and some even want to leave NATO and join Alex's alliance. The EU has folded. NATO will surely fragment too."
 endtimes.45.a: "The European Union is dissolved."
 endtimes.52.t: "Xi of China Passes"
 endtimes.52.d: "The most powerful man in the world has passed. Statistically, with all the diseases and disasters, it is strange that more leaders have not died. Still, Xi's passing was suspicious and sudden—and there is never much news out of China.\n\nNo doubt his successor will be someone closer to Alex. Li Wenhao has been named China's new leader."
 endtimes.52.a: "A sudden change at the top."
 endtimes.51.t: "Turkey to Alex's Alliance"
 endtimes.51.d: "Turkey's new leadership has adopted the Emerging outlook and is moving to end its conflicting commitments by leaving NATO and joining the MeccaPact."
 endtimes.51.a: "Our future lies with the MeccaPact."
 endtimes.54.t: "Many Nato Nations Unable to Respond"
 endtimes.54.d: "Belgium, the Netherlands, Hungary, Czechia, Bulgaria, Romania, Luxembourg, Slovakia, Portugal, Iceland, Italy, Sweden, Denmark, Spain, the United States, and Canada have told NATO they cannot honor their joint defense commitments because of instability at home. In effect, they are leaving NATO. Some fear that shifting public sentiment may even lead them to switch sides.\n\nCrime is rising, soldiers are deserting, and fascism is suddenly gaining support."
 endtimes.54.a: "NATO will have to adapt."
 endtimes.55.t: "Russia Surrenders"
 endtimes.55.d: "With Moscow and Saint Petersburg occupied, Russia has accepted surrender terms. Ilya Yashin will lead a pro-Western government with democratic elections.[GetEndtimesRussiaSurrenderOverlordReport]\n\nUkraine regains its core territory and returns Russian territory outside its own cores and claims. Russia renounces its claims on Ukrainian core territory. Kaliningrad passes to Poland, and Russia loses its claim there. If China still exists, the Far Eastern Republic is placed under Chinese authority."
 endtimes.55.a: "The war is over for Russia."
 endtimes.68.t: "China Bides Its Time"
 endtimes.68.d: "China sent volunteers west to fight for Russia but stayed out of the war itself. Beijing knew it would end up shouldering too much of the fighting while facing Japan on another front. Now that Russia has lost, China has taken full control of the Far East and can focus on the real Eastern Front."
 endtimes.68.a: "China turns its attention east."
 endtimes_russia_surrender_subject_ukraine: " Russia comes under the authority of Ukraine."
 endtimes_russia_surrender_subject_poland: " Russia comes under the authority of Poland."
 endtimes.56.t: "Russia Capitulates"
 endtimes.56.d: "WNN reports that Russia has capitulated. This war came too soon for Russia, on the heels of the others. The elites who aligned with Alex thought they would regain economic leverage and prosperity and have time to rebuild. But Alex had a near-term agenda, and Russia was a disposable asset.\n\nNATO is cleaning house this time. Russia's imperial days are officially over, and there will be peace with the West."
 endtimes.56.a: "The end of an era."
 endtimes.57.t: "Scotland Breaks Away"
 endtimes.57.d: "Two days after France split, Scotland has broken away from the United Kingdom. Northern Ireland, Greater London, and Greater Manchester have joined the new Scottish government. Army brigades have sided with it, and new drone brigades are assembling in Scotland, Northern Ireland, London, and Manchester. The separation has taken place without fighting."
 endtimes.57.a: "The United Kingdom is divided."
 endtimes.58.t: "Ireland Joins NATO"
 endtimes.58.d: "With Northern Ireland now under Scottish administration, the government in Dublin has voted to join NATO. Ireland remains at peace with Scotland."
 endtimes.58.a: "Ireland joins the alliance."
 endtimes.59.t: "Switzerland Adopts the Emerging Outlook"
 endtimes.59.d: "Following the split in France, the Federal Council has adopted the Emerging outlook while retaining democratic elections. Switzerland remains at peace with France."
 endtimes.59.a: "Switzerland changes course."
 endtimes.60.t: "NATO Recovery"
 endtimes.60.d: "Portugal, Belgium, the Netherlands, Romania, Slovenia, Iceland, Sweden, Denmark, Spain, the United States, and Canada are now stable enough to join NATO again."
 endtimes.60.a: "NATO welcomes them back."
 endtimes.61.t: "Many Prophecies"
 endtimes.61.d: "This moment of the game is actually a mix of a lot of different private revelation prophecies from saints and other mystics each who seem to have been given a glimpse of something.  Like France and England would have revolutions and Russia would threaten from the east and Islam would invade from the south.  I'm using this for a fun scenario, and use artistic license to create a somewhat balanced war as opposed to trying to match prophecies exactly.   As we know Europe has much smaller armies then this game suggests and manpower has not been adjusted to take disease and disasters into effect."
 endtimes.61.a: "Continue."
 endtimes.62.t: "Vassals to the Holy Monarchy"
 endtimes.62.d: "Recognizing Jesus spoke of one Kingdom, not many.  Allies in common cause with the priority of restoring a safe world for the Church and it's people."
 endtimes.62.a: "For the common cause."
 endtimes.63.t: "England Descends into Chaos"
 endtimes.63.d: "The UK has a well trained but tiny army and so after the disasters, diseases and now defections, the English army is not equipted to deal with all the unrest that has suddently errupted across the Britons, God forbid we may need help from the French or Irish."
 endtimes.63.a: "Continue."
 endtimes.50.t: "MeccaPact Realignment"
 endtimes.50.d: "WNN reports that countries across the Middle East, North Africa and Asia are leaving their previous alliances and entering the MeccaPact under Saudi Arabian leadership. Their governments have committed themselves to Alex's new order, the Cabal and the SOLOMON currency system.\n\nThe Saudi-led bloc has begun its expansion."
 endtimes.50.a: "A new bloc takes shape."
 endtimes.49.t: "Ukraine Allowed to Join NATO"
 endtimes.49.d: "Russia is the least of Europe's problems at the moment. With greater threats gathering across the continent, Europe needs Ukraine. The alliance has agreed to admit Ukraine as a full member of NATO."
 endtimes.49.a: "Ukraine stands with NATO."
 endtimes.48.t: "Military Coup in the United States"
 endtimes.48.d: "In light of the Miracle, American soldiers and generals have joined a general strike, refusing to continue the fighting. Across the armed forces, the demand is the same: stop the war and return to a normal United States.\n\nDonald Trump and J. D. Vance have been deposed. The military has turned to the last Speaker of the House, Hakeem Jeffries, to serve as interim president and restore civilian constitutional government.\n\nAn election will be held in November—if the world makes it that long."
 endtimes.48.a: "Let the fighting end."
 endtimes.44.t: "US Pulls Back"
 endtimes.44.d: "Following the Global Ceasefire, the U.S. military has refused to continue fighting under the current administration. The military is removing Donald Trump and turning to Hakeem Jeffries to serve as interim president until the November election."
 endtimes.44.a: "Accept the military coup and restore constitutional government."
 endtimes.64.t: "Military Forces Elections"
 endtimes.64.d: "Trump managed to overthrow Congress and defy his Supreme Court, but come 2029, the U.S. military intends to set things right."
 endtimes.64.a: "The November election will go ahead."
 endtimes.1.t: "For Your Eyes Only"
 endtimes.1.d: "On October 2, 2024, your leader personally entered into an agreement with the leader of an international shadow organization. The cabal of a very select group of very powerful, wealthy and deologically aligned leaders.  The cabal promotes common economic interests, especially personal ones, through backchannel banking and investments. Secrecy is of the utmost importance.\n\nThe agreement promises benefits to all parties: subverting democracies, propaganda, populism, sharing technology, securing infrastructure and energy deals, as well as, advancing artificial intelligence, particularly for military applications. Members are expected to help advance these shared objectives.\n\nKnowledge of the organization and any links to it must be kept to an absolute minimum. Alongside heads of state, its membership includes influential and fabulously rich oligarchs whose wealth, connections, military contacts and influence are essential to achieving these objectives."
 endtimes.1.a: "Keep this strictly confidential."
 endtimes.2.t: "The Price of Victory"
 endtimes.2.d: "For the leader of the United States, the timing of October 2, 2024, was no coincidence. With the 2024 presidential election only a few weeks away, the leader of the organization approached candidate Donald Trump. The organization deliberately has no name, but the game will call it the Cabal.\n\nThe offer was a guaranteed electoral victory in the 2024 election, secured with the help of all the other members. In exchange, Trump would commit to full participation in the organization's objectives, including supporting the interests of its members as much as possible.\n\nHe would also need to swear a measure of fealty to its leader. Trump was assured that their interests were already very closely aligned."
 endtimes.2.a: "The understanding remains confidential."

 endtimes_cabal: "Cabal"
 endtimes_cabal_desc: "An inner circle of heads of state and influential oligarchs shares technology, capital, and influence through secret agreements. Electronics research speed is increased by 5%, and stability is increased by 15%. Stability and war support are maintained at a minimum of 30% while membership lasts."
 endtimes_cabal_support_floor: "Dictators, Oligarchs, Equity Funds, the biggest players are all 2 degrees of each other, and united in greed"

 endtimes.3.t: "The Great Warning"
 endtimes.3.d: "The prophecy of Garabandal, has happened. Every person on Earth has seen the state of their soul, their sins and know Jesus is God.  It's an Illumination of Concious.\n\nSome people died during the event, but its not a rapture.  The world will never be the same now that everyone has been confronted by the supernatural."
 endtimes.3.a: "The mini-Judgement and the second of the Medjugorje's secrets"
 endtimes.4.t: "The Miracle"
 endtimes.4.d: "A permanent miracle has appeared at numerous locations around the Earth where Marian Apparitians have previously occured like Garabandal, Guadelupe, Fatima and Medjugorje.  It can be described because know one knows, it will likely be different at each of the 4 places.  It can be photographed.\n\nSick people who were present at these locations at the time of the Miracle have been cured.\n\nChurches are strained with so many returning people.  A middle-eastern businessman gained noteriety by predicting the date and time it would happen, although it's believed he had learned the secret the from the seers somehow. Two others also precisely named the date."
 endtimes.4.a: "A Miraculous Sign Appears"

 endtimes.19.t: "The Eastern Orthodox Rejoin"
 endtimes.19.d: "In the days following the Miracle, a historic reunion has begun. The Eastern churches, separated from the Roman Catholics for roughly a millennium and divided largely along national lines, are looking once more to the Pope as leader of the flock.\n\nTheir ancient liturgies, local traditions, and everyday parish life continue much as before. Yet the political meaning is profound: Greece, Romania, and Ukraine now feel far more united with northern and western Europe, sharing a renewed sense of Christian fellowship and common purpose.\n\nRussia's Orthodox Church has not yet committed to the union. Looks like Easter will be a common date this year."
 endtimes.19.a: "A divided flock begins to reunite."

 endtimes.5.t: "A New Church Begins to Emerge"
 endtimes.5.d: "The story of Alex and the Prophet as he's now referred to is spreading rapidly online and via mass media.  With the Warning and Miracle, everyone on earth is aware of the supernatural, and Alex's ability to perform signs and wonders is capturing the moment.  The One Faith as it's now called by Alex's followers, recruits clerics of other faiths like Islam, Hinduism and Buddahism and aligns it with the experience of God they just experienced.  Western Churches are opposed to this message but there are many converts in the west as well especially among previously non-religious."
 endtimes.5.a: "Alexians? The One Faith Movement"

 endtimes.6.t: "Alex Announces a Prediction"
 endtimes.6.d: "A prominant businessman who until this moment was basically unknown announced on social media predicting there soon would be a Great Warning event for all Mankind, followed later by a great visible Miracle.  Alex, who is well connected quickly had this announcement shared by super influencers."
 endtimes.6.a: "I wonder what it'll be?"

 endtimes.666.t: "Alex rises from the Dead"
 endtimes.666.d: "Three days ago an assassin attacked a wealthy businessman.\n\nThe attacker, a Catholic priest, stabbed Alex with a dagger. Alex, is known by another name, but from now on will be known simply as Alex.  He was pronounced dead from his wounds, but today he later emerged from the morgue, fully healed, and said he was given a special purpose by God to unite the faiths of the world in peace.  At least one Bishop, is claiming to have also received messages from God regarding Alex's mission and predicted soon there would be a Great Warning event for all Mankind, followed later by a great visible Miracle."
 endtimes.666.a: "A new Prophet in the Holy Land"

 endtimes.16.t: "[ROOT.GetName] Joins the MeccaPact"
 endtimes.16.d: "[ROOT.GetName] has committed itself to Alex's new order. Previous alliance commitments are cast aside as our country joins the MeccaPact under Saudi Arabian leadership.\n\nMorocco, Algeria, Egypt, Libya, Tunisia, Jordan, Saudi Arabia, Oman, Yemen, Pakistan, Bangladesh, Bahrain, Qatar, Iraq, Kuwait, Free Syria, Indonesia, Brunei, Turkmenistan, Azerbaijan, Uzbekistan, Tajikistan, Kyrgyzstan and the United Arab Emirates stand together in this realignment. Their leaders enter the Cabal, binding their fortunes to Alex and his network of allied governments and business interests.\n\nWars against any other countries are ended in white peace.\n\nParticipants adopt the SOLOMON one-world currency, gaining a permanent 4% bonus to gross weekly revenue. New adopters receive 30% debt forgiveness; countries already using SOLOMON receive no additional debt write-off. Russia is not part of this realignment."
 endtimes.16.a: "Our future lies with Alex."

 endtimes.20.t: "Pope Election, One Faith try to Infiltrate the Church"
 endtimes.20.d: "The One Faith has spread worldwide especially with the help of social media and because Alex broadcasts constantly reaching hundreds of millions of viewers. It turns out Alex has some support among Bishops and Cardinals and an attempt was made to advance the Prophet, but he was swiftly rejected. On the bright side there's a great new pope, Pope Peter, but there is now an Anti-Pope too."
 endtimes.20.a: "Long live Pope Peter§R"

 endtimes.7.t: "A hit job on the Papacy"
 endtimes.7.d: "Christian churches are calling the One Faith a heresy and the Vatican was getting ready to make a formal decree stating their teachings to be very inconsistent with Christianity and that Christians should not add the Prophet's message to it.  On Halloween night a large group of Pro-One Faith protesters, 1000s, most in costumes flash mobbed the Vatican.  It was cover for a group of assassins who stormed the Pope's apartment in the Vatican.\n\nPope Leo XVI and many other clergy are dead. Saint Peters was partially burned and many from the Vatican security like the Swiss Guard were also killed.  Many questions regarding how Italy security forces could have had such a breakdown in Rome."
 endtimes.7.a: "The Holy Father has been Martyred"

 endtimes.8.t: "A Dirty Bomb Outside Jerusalem"
 endtimes.8.d: "A dirty bomb has exploded just outside Jerusalem. Iran is suspected, and Israel has vowed retribution."
 endtimes.8.a: "The world awaits Israel's response." 
 endtimes.9.t: "Tehran Suffers a Nuclear Strike"
 endtimes.9.d: "Israel has carried out a nuclear strike on Tehran in retaliation for the dirty bomb attack outside Jerusalem. The Iranian capital has suffered the destructive effects of an atomic explosion."
 endtimes.9.a: "A catastrophe for Tehran."

 endtimes.10.t: "Europe's Battle Lines"
 endtimes.10.d: "People have suddenly gone insane, it's not just the youth protesting, older people and people with jobs and plently to lose are becoming angry and violent.  Crime is up people are ganging up, deserting posts and many are on the move.  The countries and world are dividing into two camps: areas with Christian majority and countries in Alex's alliance.\n\nOn the bright side there is a huge uptick in people willing to join the military."
 endtimes.10.a: "Civil Wars are breaking out"

 endtimes.11.t: "A New King for France"
 endtimes.11.d: "Five days after the outbreak of civil war, a predominantly Christian movement backed by loyal elements of the French Army has ousted Marine Le Pen and the National Front. Those loyal to Alex are driven from power as the surviving French government establishes a constitutional monarchy with democratic elections.\n\nTheir leader is General Geoffroy Saint-Michel of the French Army. In the presence of his loyal subordinates and many refugees, Saint Michael appeared to him and delivered this message:\n\n'The time for all to unite in Jesus' name is now. Geoffroy is chosen by Jesus as your monarch, and his son Henri as the heir, to see you through a little while longer. Geoffroy, he has been prepared his whole life for this vocation."
 endtimes.11.a: "France welcomes its new king."

 endtimes.14.t: "A Royal Chancellor for Germany"
 endtimes.14.d: "Germany has embraced the royal settlement proclaimed by King Geoffroy Saint-Michel of France. By the French monarch's appointment, General Matthias von Falkenberg takes office as Chancellor, entrusted with leading a democratic government in Germany.\n\nGermany retains its sovereignty, its armed forces, and leadership of NATO. France and Germany stand together as full allies in the struggle against the Beast. The Chancellor's royal appointment does not make Germany a French subject.\n\nMecklenburg-Vorpommern, Brandenburg, Berlin, Saxony-Anhalt, Saxony, and Thuringia form an independent East Germany, with its capital in Berlin. The new state inherits Germany's current technology and recreates the military formations historically based in its territory. Germany's government moves to Bonn."
 endtimes.14.a: "The Chancellor takes his oath."

 endtimes.17.t: "[ROOT.GetName] Joins the Royal Settlement"
 endtimes.17.d: "Following the restoration of the French monarchy under King Geoffroy Saint-Michel, Spain and Portugal have agreed to join the royal settlement.\n\nOur government adopts monarchist rule while retaining its present national leader, who will continue to govern under the new political order. Elections are abolished as the country commits itself to the monarchy.\n\nSpain and Portugal confirm their place in NATO, returning to the alliance if necessary."
 endtimes.17.a: "We join the royal settlement."

 endtimes.18.t: "[ROOT.GetName] Joins the Royal Settlement"
 endtimes.18.d: "Ten days after the restoration of the French monarchy under King Geoffroy Saint-Michel, the United Kingdom and Ireland have agreed to join the royal settlement.\n\nOur government adopts monarchist rule while retaining its present national leader. Elections are abolished under the new political order.\n\nIreland joins NATO, and the United Kingdom confirms its place in the alliance, returning if necessary. Together with France, Germany, Spain, and Portugal, they stand within the same alliance."
 endtimes.18.a: "We join the royal settlement and NATO."

 endtimes.12.t: "We are living the Book of Revelation"
 endtimes.12.d: "There is no denying it any longer: the Book of Revelation is now unfolding in real time, you can feal it, but you either feel the good stronger or the evil stronger. The religion of Alex has spread throughout the world, and in some areas persecution of anyone else is fierce.\n\n§YMark 13:14§!\n\"When you see ‘the abomination that causes desolation’ [Alex's priests] standing where it does not belong—let the reader understand—then let those who are in Judea flee to the mountains."
 endtimes.12.a: "Hold firm to Jesus Christ."

 endtimes.13.t: "A Bad Harvest"
 endtimes.13.d: "The super El Niño of 2026 brought lower harvests across Asia and Africa, compounded by the failure to export Black Sea grain because of war.\n\nIn 2027, unfavorable conditions also struck the Western world, ushering in famine in parts of Africa and Southeast Asia.\n\nThese droughts, combined with earthquakes and the need for constant relief efforts, are placing an especially heavy strain on the developing world. More countries are struggling to survive as functioning states."
 endtimes.13.a: "The world faces a growing crisis."

 endtimes.75.t: "WestNATO Returns to NATO"
 endtimes.75.d: "The governments of WestNATO have dissolved their temporary alliance and returned to NATO under German leadership. Their return reunites the allies on both sides of the Atlantic."
 endtimes.75.a: "Welcome back."

 endtimes.76.t: "The United States Returns to NATO"
 endtimes.76.d: "With a Western government back in Washington, the United States has formally restored its NATO membership. Germany continues to lead the alliance."
 endtimes.76.a: "Welcome back."

 endtimes.72.t: "The Grim Mark is reached"
 endtimes.72.d: "With the war and disasters, not to mention a little bit of nuclear winter on top of it, the world has surpassed 2 billion dead, with no sign of stabilization."
 endtimes.72.a: "A grim milestone."

 endtimes.21.t: "Famine and Other Disasters"
 endtimes.21.d: "Starting with the super El Niño of 2026 and continuing through 2027, 2028, and now 2029, the world has endured a nonstop series of droughts, floods, earthquakes, and other disasters, now compounded by the Great Reset of the Banking System.\n\nFamine and plague are running rampant through the developing world. These are not new diseases, but old and existing ones that have spiraled out of control, like HIV and Ebola.\n\nOver a billion fewer people are alive today than in 2027."
 endtimes.21.a: "The suffering continues."

 endtimes.22.t: "France Splits in Two"
 endtimes.22.d: "After the incident at the Vatican, Marine Le Pen's government revealed that it was allied with Alex and intended to bring France into the SOLOMON system.\n\nThe socialist far left opposed the move and has proclaimed the French Popular Republic under the Emerging outlook. The two governments have separated without going to war."
 endtimes.22.a: "France is divided."

 endtimes_disasters: "Disasters"
 endtimes_disasters_desc: "The disasters are claiming lives and disrupting essential services across the country."
 endtimes_disasters_tt: "Monthly population losses from February through April 2029 target §R5% below Fifth Seal levels§! by the Grim Mark."

 endtimes_disaster_famine_and_disease: "Disaster, Famine and Disease"
 endtimes_disaster_famine_and_disease_desc: "War, crop failures, and disease are taking lives in every part of the world."
 endtimes_disaster_famine_and_disease_tt: "Monthly population losses from February through April 2029 target §R20% below Fifth Seal levels§! by the Grim Mark."

 endtimes_famine_and_disease: "Famine and Disease"
 endtimes_famine_and_disease_desc: "Repeated harvest failures, disease outbreaks, and collapsing relief networks have left the population struggling for survival. Essential civilian needs consume the country's productive capacity."
 endtimes_famine_consumption_floor: "Famine and Disease"
 endtimes_famine_consumption_floor_tt: "Consumer-goods demand is maintained at a minimum of §R90%§!, recalculated daily. Any higher demand is preserved."

 endtimes.23.t: "Saudi Arabia, Turkey and Pakistan Sign Defense Pact"
 endtimes.23.d: "WNN reports that Saudi Arabia, Turkey and Pakistan have signed a mutual defense pact, pledging to guarantee one another's independence and refrain from aggression against each other.\n\nThe three governments describe the agreement as a response to the conflict with Iran and the Houthis in Yemen. By coordinating their security commitments, they hope to deter further attacks and strengthen their position in the region.\n\nAlthough presented as a defensive arrangement, the pact could also be seen as hostile to Israel, adding another source of tension to an already volatile Middle East."
 endtimes.23.a: "A new security pact in the region."

 endtimes.24.t: "Israel Drops Nuclear Bomb on Iran"
 endtimes.24.d: "WNN reports that Israel has dropped a nuclear bomb on Tehran, Iran's capital, in retaliation for the dirty bomb attack outside Jerusalem. The strike marks a dramatic escalation of the crisis in the Middle East.\n\nThe world is on edge as governments watch for Iran's response. Will Tehran retaliate, will other powers be drawn into the conflict, or can diplomacy prevent further escalation?\n\nWith the possibility of more nuclear strikes now looming over the region, the coming days could determine whether this catastrophe remains a single attack or becomes the opening of a wider war."
 endtimes.24.a: "The world holds its breath."

 endtimes.25.t: "Alex's alliance starts to expand"
 endtimes.25.d: "An alliance of One Faith nations has officially come together with Alex as their messiah. Saudi Arabia has founded the MeccaPact and will lead it under the House of Saud, which has adopted the Emerging outlook. The pact unites the interests of the new Church and State through full economic and strategic military cooperation.\n\nAlgeria and Egypt are set to join the Saudi-led pact on October 4. Egypt will adopt the Emerging outlook before joining. Many other countries are showing interest, especially for the economic benefits."
 endtimes.25.a: "One Faith, One World"
 endtimes_sau_non_aligned_desc: "(Non-Aligned Autocracy) - House of Saud. The royal family continues to govern Saudi Arabia as it leads the MeccaPact."
 endtimes_sau_emerging_desc: "(Emerging Autocracy) - House of Saud. The royal family continues to govern Saudi Arabia as it leads the MeccaPact."
 SAU_MECCAPACT: "Saudi Arabia"
 SAU_MECCAPACT_DEF: "Saudi Arabia"
 SAU_MECCAPACT_ADJ: "Saudi Arabian"
