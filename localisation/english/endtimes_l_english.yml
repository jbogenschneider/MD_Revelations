l_english:
 endtimes.15.t: "Alex Takes Over"
 endtimes.15.d: "Vladimir Putin was beholden to Alex, but ultimately led Russia to ruin. Now Alex is taking direct control of Russia, with the full support of the oligarchy.\n\nHe brings a vast personal fortune, a complete artificial intelligence system, and a new currency. Russia is starting over, free of international debt and ready to put its oil revenues to work rebuilding the country. Through Alex's global business ties, especially in the Middle East, Russia will soon be back in business.  Alex still uses another Russian Oligarch as the actual figurehead in public as he wants to remain a religious rather then political figure for now.\n\nTo begin this new era, Russia ends its current wars in a white peace. The Cabal remains at the heart of the new order, joined by Kazakhstan and Belarus. The treasury receives 300 billion dollars, and the next election is scheduled for January 2040."
 endtimes.15.a: "Russia begins again under Alex."

 endtimes.1.t: "For Your Eyes Only"
 endtimes.1.d: "On October 2, 2024, your leader personally entered into an agreement with the leader of an international shadow organization. The cabal of a very select group of very powerful, wealthy and deologically aligned leaders.  The cabal promotes common economic interests, especially personal ones, through backchannel banking and investments. Secrecy is of the utmost importance.\n\nThe agreement promises benefits to all parties: subverting democracies, propaganda, populism, sharing technology, securing infrastructure and energy deals, as well as, advancing artificial intelligence, particularly for military applications. Members are expected to help advance these shared objectives.\n\nKnowledge of the organization and any links to it must be kept to an absolute minimum. Alongside heads of state, its membership includes influential and fabulously oligarchs whose wealth, connections, military contacts and influence are essential to achieving these objectives."
 endtimes.1.a: "Keep this strictly confidential."
 endtimes.2.t: "The Price of Victory"
 endtimes.2.d: "For the leader of the United States, the timing of October 2, 2024, was no coincidence. With the 2024 presidential election only a few weeks away, the leader of the organization approached candidate Donald Trump. The organization deliberately has no name, but the game will call it the Cabal.\n\nThe offer was a guaranteed electoral victory in the 2024 election, secured with the help of all the other members. In exchange, Trump would commit to full participation in the organization's objectives, including supporting the interests of its members as much as possible.\n\nHe would also need to swear a measure of fealty to its leader. Trump was assured that their interests were already very closely aligned."
 endtimes.2.a: "The understanding remains confidential."

 endtimes_cabal: "Cabal"
 endtimes_cabal_desc: "An inner circle of heads of state and influential oligarchs shares technology, capital, and influence through secret agreements. Electronics research speed is increased by 5%. Stability and war support are maintained at a minimum of 30% while membership lasts."
 endtimes_cabal_support_floor: "Cabal"

 endtimes.3.t: "The Great Warning"
 endtimes.3.d: "A prophecy foretold by many sources has come to pass. Every person on Earth has seen the state of their soul and has been confronted with the existence of God and His Son, Jesus Christ.\n\nMany died during the event. Over the next few months, millions will convert to Christianity, and the effects on global politics will soon be felt."
 endtimes.3.a: "The world will never be the same."
 endtimes.4.t: "The Miracle"
 endtimes.4.d: "A permanent miracle has appeared at numerous locations around the Earth: a suspended Cross that can be seen and photographed, but strangely cannot be touched. It is not a projection.\n\nSick people who were present at these locations at the time of the Miracle claim to have been cured.\n\nThe world is still reeling from the Warning, and now this."
 endtimes.4.a: "We have witnessed the Miracle."

 endtimes.5.t: "A New Church Begins to Emerge"
 endtimes.5.d: "Starting in Jerusalem, a businessman who claims to have predicted the Miracle is gaining followers for his new church. He presents it as the perfect home for new believers in God, as well as those coming from Islam, Judaism, or any other faith. His invitation is simple: 'We accept anyone.'\n\nWhat is astonishing is that he has a priest who seems able to perform miracles.\n\nWith the help of AI apps and social media, the religion is spreading rapidly, especially in Asia and India."
 endtimes.5.a: "A new movement takes shape."

 endtimes.6.t: "The New Prophet's Miracle"
 endtimes.6.d: "On Good Friday, 2029, only a few days after the Aposis Comet broke apart just as Alex had predicted, a would-be assassin attacked the new prophet.\n\nThe attacker, a Catholic zealot, ran Alex through with a sword. Alex supposedly died from his wounds, but a few days later he reemerged, fully healed."
 endtimes.6.a: "Another extraordinary claim."

 endtimes.16.t: "[ROOT.GetName] Joins Alex's Alliance"
 endtimes.16.d: "[ROOT.GetName] has committed itself to Alex's new order. Previous alliance commitments are cast aside as our country joins the Russian-led CSTO.\n\nItaly, Switzerland, Iceland, Bulgaria, Serbia, Bosnia, Turkey, Montenegro, Albania, Slovakia, the Czech Republic, Georgia, Morocco, Algeria, Egypt, Libya, Tunisia, Israel, Saudi Arabia, Pakistan, India, and the United Arab Emirates stand together in this realignment. Their leaders enter the Cabal, binding their fortunes to Alex and his network of allied governments and business interests.\n\nWars against countries outside NATO are ended in white peace. Existing wars against NATO members continue."
 endtimes.16.a: "Our future lies with Alex."

 endtimes.7.t: "The False Prophet Takes the Papacy"
 endtimes.7.d: "The new Unified Christianity has become more popular than Catholicism. The Papacy has made it clear that it views us as heretics, despite our signs and popularity.\n\nWe have therefore asked the Prime Minister of Italy to evict the Vatican's existing leadership and make room for the new Pope.\n\nPope Leo has been replaced by The False Prophet."
 endtimes.7.a: "A new Pope takes his place."

 endtimes.8.t: "A Dirty Bomb Outside Jerusalem"
 endtimes.8.d: "A dirty bomb has exploded just outside Jerusalem. Iran is suspected, and Israel has vowed retribution."
 endtimes.8.a: "The world awaits Israel's response."
 endtimes.9.t: "Tehran Suffers a Nuclear Strike"
 endtimes.9.d: "Israel has carried out a nuclear strike on Tehran in retaliation for the dirty bomb attack outside Jerusalem. The Iranian capital has suffered the destructive effects of an atomic explosion."
 endtimes.9.a: "A catastrophe for Tehran."

 endtimes.10.t: "Europe Realigns"
 endtimes.10.d: "The forcible replacement and exile of the real Pope have exposed the reality of the One World Religion: it is not merely religious, but political. With most of the world clearly aligned with the leader of the Cabal, Western politicians have awakened to the fact that Alex, as he wishes to be called, is indeed the Antichrist and must be resisted.\n\nA leader has emerged in France: the rightful heir to the throne. What remains of NATO will begin to unite under a single banner for the True Christ, if only to try to survive this tribulation.\n\nProphecy speaks of an Era of Peace once Alex's reign ends."
 endtimes.10.a: "Europe prepares to resist."

 endtimes.11.t: "A New Shepherd and New King"
 endtimes.11.d: "When the Vatican was attacked, many priests, including Pope Leo XIV, were martyred. Yet the Church had a contingency plan. A new conclave is taking place right now in Lourdes, France, made possible only by the swift action of part of the French Army, which secured the surrounding area.\n\nFrance's president has been compromised for some time. But among the country's many factions, the Christians proved strong enough to drive the Beast's loyalists out of France, at least for the moment.\n\nTheir leader is General Geoffroy Saint-Michel of the French Army. In the presence of his loyal subordinates and many refugees, Saint Michael appeared to him and delivered this message:\n\n'The time for all to unite in Jesus' name is now. Geoffroy is chosen by Jesus as your monarch, and his son Henri as the heir, to see you through a little while longer. He shall be your just leader, together with the Angelic Pope about to be elected.'\n\nHenri is twenty years old and devout. As for Geoffroy, he has been prepared his whole life for this vocation.\n\nThe restored monarchy confirms France's place in NATO, joining the alliance if necessary. Belgium is incorporated into France under the royal settlement. Sardinia, Sicily, Campania and Naples, Calabria, and Puglia pass from Italy to France. Monaco, San Marino, and Liechtenstein are also incorporated into the restored kingdom."
 endtimes.11.a: "France welcomes its new king."

 endtimes.14.t: "A Royal Chancellor for Germany"
 endtimes.14.d: "Germany has embraced the royal settlement proclaimed by King Geoffroy Saint-Michel of France. By the French monarch's appointment, General Matthias von Falkenberg takes office as Chancellor, entrusted with governing Germany under the new monarchy.\n\nGermany retains its sovereignty, its armed forces, and leadership of NATO. France and Germany stand together as full allies in the struggle against the Beast. The Chancellor's royal appointment does not make Germany a French subject.\n\nThe settlement also redraws Central Europe's borders. The Netherlands, Austria, and Denmark are incorporated into Germany, while Mecklenburg-Vorpommern, Brandenburg, Berlin, Saxony-Anhalt, Saxony, and Thuringia pass to the Czech Republic. Germany's government moves to Bonn."
 endtimes.14.a: "The Chancellor takes his oath."

 endtimes.12.t: "Prophecy Fulfilled"
 endtimes.12.d: "There is no denying it any longer: the Book of Revelation is now unfolding in real time. Rome and Israel are under the control of the Beast, the religion of his False Prophet has spread throughout the world, and Christians are threatened everywhere.\n\nChristians must flee and gather together for safety, to endure the next few years until the biblical Millennium, or Era of Peace, that awaits those who hold firm to Jesus Christ and survive.\n\n§YMark 13:14§!\n\"When you see ‘the abomination that causes desolation’ standing where it does not belong—let the reader understand—then let those who are in Judea flee to the mountains.\"\n\n§YDaniel 9:27 — The prophecy Jesus references§!\n\"He will confirm a covenant with many for one ‘seven.’ In the middle of the ‘seven’ he will put an end to sacrifice and offering. And at the temple he will set up an abomination that causes desolation, until the end that is decreed is poured out on him.\"\n\n§YRevelation 12:6 — The escape from the dragon/beast§!\n\"The woman fled into the wilderness to a place prepared for her by God, where she might be taken care of for 1,260 days.\"\n\n§YRevelation 20:2–3§!\n\"He seized the dragon, that ancient serpent, who is the devil, or Satan, and bound him for a thousand years. He threw him into the Abyss, and locked and sealed it over him, to keep him from deceiving the nations anymore until the thousand years were ended. After that, he must be set free for a short time.\""
 endtimes.12.a: "Hold firm to Jesus Christ."

 endtimes.13.t: "A Bad Harvest"
 endtimes.13.d: "The super El Niño of 2026 brought lower harvests across Asia and Africa, compounded by the failure to export Black Sea grain because of war.\n\nIn 2027, unfavorable conditions also struck the Western world, ushering in famine in parts of Africa and Southeast Asia.\n\nThese droughts, combined with earthquakes and the need for constant relief efforts, are placing an especially heavy strain on the developing world. More countries are struggling to survive as functioning states."
 endtimes.13.a: "The world faces a growing crisis."
