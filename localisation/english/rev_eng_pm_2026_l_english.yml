 rev_eng_pm_2026.1.t: "Andy Burnham Becomes Prime Minister"
 rev_eng_pm_2026.1.d: "Andy Burnham has succeeded Keir Starmer as prime minister of the United Kingdom. The change in Labour leadership takes effect on July 20, 2026.\n\nThe government's existing electoral mandate and election timetable remain in place."
 rev_eng_pm_2026.1.a: "The new prime minister takes office."
