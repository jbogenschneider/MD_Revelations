l_english:
 REV_FRA_learn_ukrainian_ground_robotics:0 "Learn from Ukrainian Ground Robotics"
 REV_FRA_learn_ukrainian_ground_robotics_desc:0 "Ukraine has established a practical ground robotics programme. Exchange engineers, production methods and frontline lessons on unmanned sentry guns, lorries, demining and rescue vehicles. Learning from Ukrainian experience will satisfy our fire-support land-drone special-project requirement and open the way to normal combat robot research."
 REV_GER_learn_ukrainian_ground_robotics:0 "Learn from Ukrainian Ground Robotics"
 REV_GER_learn_ukrainian_ground_robotics_desc:0 "Ukraine has established a practical ground robotics programme. Exchange engineers, production methods and frontline lessons on unmanned sentry guns, lorries, demining and rescue vehicles. Learning from Ukrainian experience will satisfy our fire-support land-drone special-project requirement and open the way to normal combat robot research."
 REV_GER_joint_robot_batches_for_ukraine:0 "Joint Robot Batches for Ukraine"
 REV_GER_joint_robot_batches_for_ukraine_desc:0 "Put Ukrainian field lessons into production. Build an initial batch of two hundred ground robots: one hundred for our own forces and one hundred for Ukraine. Operating the platforms together will support further work on sentry, logistics, demining and casualty evacuation duties."
