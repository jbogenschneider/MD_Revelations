 rev_nato_reorganization.1.t:0 "NATO Adjusts to Avoid Falling Apart"
 rev_nato_reorganization.1.d:0 "With Russia still a threat in Europe NATO can't all rush to Canada's aid, so the alliance has decided to temporarily reorganize so that most of the alliance stays focused on Europe while volunteers and those with North American ties can directly confront the USA. Britain leads WestNATO alongside Canada, Denmark, Iceland, Norway, Sweden and the Netherlands. Germany leads the remaining NATO members, who continue to cooperate with WestNATO under mutual non-aggression pacts. It's the best we can do for now."
 rev_nato_reorganization.1.a:0 "A temporary solution."
