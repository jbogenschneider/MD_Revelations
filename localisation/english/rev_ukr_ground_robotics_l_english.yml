 REV_UKR_unmanned_ground_systems_priority:0 "Unmanned Ground Systems First"
 REV_UKR_unmanned_ground_systems_priority_desc:0 "Unmanned sentry guns, lorries, demining vehicles and rescue vehicles must become Ukraine's highest procurement priority. Every dangerous task performed by a remotely operated machine can spare a soldier's life. Bring manufacturers, engineers and frontline operators together to establish a practical ground robotics programme, replacing the conventional special-project route with an urgent national effort."
 REV_UKR_multisource_land_drone_field_trials:0 "Multi-Source Land Drone Field Trials"
 REV_UKR_multisource_land_drone_field_trials_desc:0 "Multi-source the first batches of land drones and experiment in the field. Obtain platforms from domestic workshops and several external suppliers, then put them into Ukrainian service as sentries, cargo carriers, demining vehicles and casualty evacuation platforms. The first hundred ground robots will let frontline units compare designs and develop practical tactics before wider procurement."
